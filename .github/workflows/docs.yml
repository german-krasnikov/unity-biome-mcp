name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/generate_schema_page.py'
      - 'server/src/unity_mcp/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Install server (needed for tool export)
        working-directory: server
        run: pip install ".[dev]"

      - name: Generate tool schema page
        run: |
          mkdir -p reports docs/tools-schema
          python scripts/export_tools.py --format toolsmith --out reports/tools-toolsmith.json
          pip install mcp-tool-card-linter==1.0.0
          mcp-tool-card-linter lint --tools-file reports/tools-toolsmith.json --json-report reports/toolsmith.json --fail-on never || true
          python scripts/generate_schema_page.py \
            --tools reports/tools-toolsmith.json \
            --scores reports/toolsmith.json \
            --out docs/tools-schema/index.md

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
