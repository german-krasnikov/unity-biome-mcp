name: CI Conformance

on:
  pull_request:
    branches: [master]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'unity-plugin/**'
      - 'unity-plugin-reload/**'
      - 'unity-test-project/**'
      - '.github/workflows/ci-conformance.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'unity-plugin/**'
      - 'unity-plugin-reload/**'
      - 'unity-test-project/**'
      - '.github/workflows/ci-conformance.yml'
  workflow_dispatch:
    inputs: {}

concurrency:
  group: ci-conformance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-gate:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Run unit tests
        working-directory: server
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: python -m pytest tests/ -m "not live and not monkey" -q --timeout=30

  attested-public-stdio:
    name: Attested public stdio profile
    runs-on: ubuntu-latest
    needs: unit-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Run attested public stdio profile
        run: |
          mkdir -p reports
          HEAD_SHA=$(git rev-parse HEAD)
          python scripts/attested_conformance_runner.py \
            --source-root . \
            --policy scripts/gauntlet/release-policy.json \
            --expected-head "$HEAD_SHA" \
            --profile public-stdio-linux-py314 \
            --junit reports/attested-public-stdio.xml \
            --timeout 120

      - name: Upload attested profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: attested-public-stdio
          path: reports/attested-public-stdio.xml
          retention-days: 30

  hosted-disposable-unity:
    name: Hosted disposable Unity conformance (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-gate, attested-public-stdio]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build-target: StandaloneLinux64
            hub-version: '3.19.5'
          - name: macOS
            runner: macos-latest
            build-target: StandaloneOSX
            hub-version: ''
          - name: Windows
            runner: windows-2022
            build-target: StandaloneWindows64
            hub-version: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install VC++ 2010 runtime (Unity 6 dependency)
        if: |
          runner.os == 'Windows' &&
          (github.event_name != 'pull_request' || matrix.name == 'Linux')
        shell: powershell
        run: choco install vcredist2010 -y

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Set UPM cache path
        id: upm-path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "path=$HOME/Library/Caches/Unity/upm" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"
          else
            echo "path=$LOCALAPPDATA/Unity/cache/upm" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache UPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: conformance-upm-${{ runner.os }}-${{ hashFiles('unity-test-project/Packages/packages-lock.json') }}
          restore-keys: |
            conformance-upm-${{ runner.os }}-

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b  # v2
        id: unity-setup
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        timeout-minutes: 30
        with:
          unity-version: 6000.0.65f1
          build-targets: ${{ matrix.build-target }}
          cache-installation: ${{ runner.os != 'Windows' }}
          hub-version: ${{ matrix.hub-version }}

      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af  # v2
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Capture MCP monitor before conformance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-before.json

      - name: Run hosted disposable Unity conformance
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        shell: bash
        run: |
          python scripts/run_hosted_conformance.py \
            --unity "${{ steps.unity-setup.outputs.unity-editor-path }}" \
            --source-project unity-test-project \
            --work-root "$RUNNER_TEMP/unity-mcp-conformance-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --reports reports \
            --port-a 9600 \
            --port-b 9699 \
            --startup-timeout 420 \
            --timeout 300 \
            --verbose

      - name: Capture MCP monitor after conformance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-after.json

      - name: Upload MCP monitor reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hosted-conformance-${{ matrix.name }}
          path: reports/
          retention-days: 30
