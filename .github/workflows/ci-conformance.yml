name: CI Conformance

on:
  pull_request:
    branches: [master]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'unity-plugin/**'
      - 'unity-plugin-reload/**'
      - 'unity-test-project/**'
      - '.github/workflows/ci-conformance.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'unity-plugin/**'
      - 'unity-plugin-reload/**'
      - 'unity-test-project/**'
      - '.github/workflows/ci-conformance.yml'
  workflow_dispatch:
    inputs:
      unity_port:
        description: 'Unity MCP port'
        required: false
        default: '9500'
      project_path:
        description: 'Unity project path'
        required: true
      second_port:
        description: 'Second Unity port for cross-project tests (0 = skip)'
        required: false
        default: '0'
      second_project_path:
        description: 'Second Unity project path (Worker B, required if second_port > 0)'
        required: false
        default: ''

concurrency:
  group: ci-conformance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-gate:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Run unit tests
        working-directory: server
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: python -m pytest tests/ -m "not live and not monkey" -q --timeout=30

  attested-public-stdio:
    name: Attested public stdio profile
    runs-on: ubuntu-latest
    needs: unit-gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Run attested public stdio profile
        run: |
          mkdir -p reports
          HEAD_SHA=$(git rev-parse HEAD)
          python scripts/attested_conformance_runner.py \
            --source-root . \
            --policy scripts/gauntlet/release-policy.json \
            --expected-head "$HEAD_SHA" \
            --profile public-stdio-linux-py312 \
            --junit reports/attested-public-stdio.xml \
            --timeout 120

      - name: Upload attested profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: attested-public-stdio
          path: reports/attested-public-stdio.xml
          retention-days: 30

  conformance-single:
    name: Conformance (single worker)
    runs-on: self-hosted
    needs: [unit-gate, attested-public-stdio]
    if: vars.CONFORMANCE_PROJECT_PATH != '' || inputs.project_path != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Capture MCP monitor before conformance
        if: always()
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-before.json

      - name: Discover Unity port
        id: port
        env:
          INPUT_PORT: ${{ inputs.unity_port }}
        run: |
          PORT="$INPUT_PORT"
          if [ -z "$PORT" ]; then
            DISCOVERED=$(python3 -c "import pathlib; p=list(pathlib.Path.home().glob('.unity-biome-mcp/ports/*.port')); print(open(p[0]).read().split()[0] if p else '')" 2>/dev/null || echo "")
            [ -n "$DISCOVERED" ] && PORT="$DISCOVERED" || PORT="9500"
          fi
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Run conformance
        env:
          UNITY_PORT: ${{ steps.port.outputs.port }}
          PROJECT_PATH: ${{ inputs.project_path || vars.CONFORMANCE_PROJECT_PATH }}
        run: |
          python scripts/conformance_runner.py \
            --port "$UNITY_PORT" \
            --project "$PROJECT_PATH" \
            --junit reports/conformance-single.xml \
            --record reports/conformance-single-trace.jsonl \
            --timeout 300 \
            --verbose

      - name: Capture MCP monitor after conformance
        if: always()
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-after.json

      - name: Upload MCP monitor reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mcp-monitor-single
          path: reports/
          retention-days: 30

  conformance-dual:
    name: Conformance (dual worker)
    runs-on: self-hosted
    needs: [unit-gate, attested-public-stdio]
    if: vars.CONFORMANCE_SECOND_PROJECT_PATH != '' || inputs.second_project_path != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install server with dev deps
        run: pip install -e "server[dev]"

      - name: Capture MCP monitor before conformance
        if: always()
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-before.json

      - name: Run dual conformance
        env:
          PORT_A: ${{ inputs.unity_port || vars.CONFORMANCE_PORT }}
          PROJECT_A: ${{ inputs.project_path || vars.CONFORMANCE_PROJECT_PATH }}
          PORT_B: ${{ inputs.second_port || vars.CONFORMANCE_SECOND_PORT }}
          PROJECT_B: ${{ inputs.second_project_path || vars.CONFORMANCE_SECOND_PROJECT_PATH }}
        run: |
          python scripts/conformance_runner.py \
            --port "$PORT_A" \
            --project "$PROJECT_A" \
            --second-port "$PORT_B" \
            --second-project "$PROJECT_B" \
            --markers 'cross_project and live' \
            --junit reports/conformance-dual.xml \
            --record reports/conformance-dual-trace.jsonl \
            --timeout 300 \
            --verbose

      - name: Capture MCP monitor after conformance
        if: always()
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/monitor_mcp_processes.py --max-version-seconds 60 | tee reports/mcp-monitor-after.json

      - name: Upload MCP monitor reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mcp-monitor-dual
          path: reports/
          retention-days: 30
