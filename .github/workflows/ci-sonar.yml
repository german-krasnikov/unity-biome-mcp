name: SonarCloud

on:
  push:
    branches: [master]
    paths:
      - "server/src/**"
      - "unity-plugin/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonar.yml"
  pull_request:
    branches: [master]
    paths:
      - "server/src/**"
      - "unity-plugin/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonar.yml"
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  python-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and run tests with coverage
        run: |
          pip install "./server[dev]"
          cd server && PYTHONWARNDEFAULTENCODING=1 python -m pytest tests -m "not live and not monkey" -q \
            --cov=unity_mcp --cov-report=xml:coverage.xml --cov-config=pyproject.toml
        continue-on-error: true

      - name: Fix coverage paths
        run: |
          if [ -f server/coverage.xml ]; then
            sed -i 's|<source>.*</source>|<source>.</source>|g' server/coverage.xml
            sed -i 's|filename="src/|filename="server/src/|g' server/coverage.xml
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: server/coverage.xml
          retention-days: 1

  csharp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set UPM cache path
        id: upm-path
        run: echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: upm-Linux-${{ hashFiles('unity-test-project/Packages/packages-lock.json') }}
          restore-keys: upm-Linux-

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b
        id: unity-setup
        timeout-minutes: 15
        with:
          unity-version: 6000.0.65f1
          build-targets: StandaloneLinux64
          cache-installation: true
          hub-version: '3.19.5'

      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Generate .sln
        uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a
        with:
          build-target: StandaloneLinux64
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: unity-test-project
          args: -batchmode -nographics -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution -quit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Deduplicate .sln and build
        run: |
          SLN=$(find unity-test-project unity-test-project-ro -maxdepth 1 -name "*.sln" 2>/dev/null | head -1)
          if [ -z "$SLN" ]; then
            echo "::warning::No .sln found"
            exit 0
          fi
          DEDUP="${SLN%.sln}-dedup.sln"
          python3 scripts/dedup_sln.py "$SLN" "$DEDUP"
          dotnet build "$DEDUP" || echo "::warning::dotnet build failed (some projects may have issues)"

      - uses: actions/upload-artifact@v4
        with:
          name: csharp-sln
          path: |
            unity-test-project/*.sln
            unity-test-project/*.csproj
            unity-test-project/.sonarqube/
          retention-days: 1

  sonar-scan:
    runs-on: ubuntu-latest
    needs: [python-coverage, csharp-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: server

      - uses: actions/download-artifact@v4
        with:
          name: csharp-sln
          path: unity-test-project
        continue-on-error: true

      - name: Hide sonar-project.properties
        run: mv sonar-project.properties sonar-project.properties.bak

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"german-krasnikov_unity-biome-mcp" \
            /o:"german-krasnikov" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="." \
            /d:sonar.python.version="3.10,3.11,3.12" \
            /d:sonar.python.coverage.reportPaths="server/coverage.xml" \
            /d:sonar.sources="server/src/unity_mcp,unity-plugin/Editor,unity-plugin-reload/Editor" \
            /d:sonar.tests="server/tests,unity-plugin/Editor/Tests" \
            /d:sonar.exclusions="**/*.meta,unity-test-project/**,**/__pycache__/**" \
            /d:sonar.test.exclusions="server/tests/**,unity-plugin/Editor/Tests/**,scripts/tests/**" \
            /d:sonar.sourceEncoding="UTF-8"

      - name: Build with sonar hooks (if .sln available)
        run: |
          SLN=$(find unity-test-project -maxdepth 1 -name "*-dedup.sln" -o -name "*.sln" 2>/dev/null | head -1)
          if [ -n "$SLN" ]; then
            dotnet build "$SLN" || echo "::warning::Build partial"
          else
            echo "::warning::No .sln — C# analysis limited to source scanning"
          fi
        continue-on-error: true

      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Restore sonar-project.properties
        if: always()
        run: mv sonar-project.properties.bak sonar-project.properties 2>/dev/null || true
