name: Nightly Full Regression

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:       # manual trigger

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-full:
    name: Python Full (incl. monkey + slow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: server
        run: pip install -e ".[dev]"

      - name: Run full Python suite (unit + monkey + slow)
        working-directory: server
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: python -m pytest tests/ -m "not live" -q --tb=short --timeout=120

      - name: Run install tests
        if: always()
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: python -m pytest install/tests/ -q --tb=short

      - name: Run scripts tests
        if: always()
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: python -m pytest scripts/tests/ -q --tb=short

  csharp-full:
    name: C# Full (all categories)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create artifacts directory
        shell: bash
        run: mkdir -p artifacts

      - name: Set UPM cache path
        id: upm-path
        shell: bash
        run: echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"

      - name: Cache UPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: upm-Linux-${{ hashFiles('unity-test-project/Packages/packages-lock.json') }}
          restore-keys: |
            upm-Linux-

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b  # v2
        id: unity-setup
        timeout-minutes: 15
        with:
          unity-version: 6000.0.65f1
          build-targets: StandaloneLinux64

      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af  # v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a  # v3
        name: Run ALL EditMode Tests (no filter)
        with:
          build-target: StandaloneLinux64
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: unity-test-project
          args: >
            -batchmode
            -nographics
            -runTests
            -testPlatform EditMode
            -testResults ${{ github.workspace }}/artifacts/editmode-results.xml
            -logFile ${{ github.workspace }}/artifacts/unity.log

      - name: Check test results exist
        id: check-results
        if: always()
        shell: bash
        run: test -f artifacts/editmode-results.xml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        if: always() && steps.check-results.outputs.exists == 'true'
        with:
          name: 'Nightly C# EditMode'
          path: artifacts/*.xml
          reporter: dotnet-nunit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-unity-results
          path: artifacts/
