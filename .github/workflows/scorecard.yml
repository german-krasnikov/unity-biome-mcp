name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '30 3 * * 1'   # Monday 03:30 UTC (offset from other Monday jobs)

# Minimal top-level permissions — jobs narrow further
permissions: read-all

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
      id-token: write          # OIDC token for publishing to api.securityscorecards.dev
      contents: read           # checkout

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75b087ac80  # v2.4.1
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true   # publishes to api.securityscorecards.dev via OIDC

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
