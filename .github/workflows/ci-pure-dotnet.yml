name: CI Pure .NET

on:
  push:
    branches: [master, "feat/**", "feature/**", "fix/**"]
    paths:
      - "unity-plugin/Runtime/Playtest/Core/**"
      - "unity-plugin/Tests~/**"
      - ".github/workflows/ci-pure-dotnet.yml"
  pull_request:
    branches: [master]
    paths:
      - "unity-plugin/Runtime/Playtest/Core/**"
      - "unity-plugin/Tests~/**"
      - ".github/workflows/ci-pure-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: ci-pure-dotnet-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pure dotnet test (PlaytestCore)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "6.0.x"

      - name: dotnet test
        working-directory: unity-plugin/Tests~/Pure
        run: dotnet test UnityMCP.Playtest.Core.Tests.csproj -c Release
