name: CI Python

on:
  push:
    branches: [master, "feat/**", "feature/**", "fix/**"]
    paths:
      - "server/**"
      - "install/**"
      - "scripts/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "server/**"
      - "install/**"
      - "scripts/**"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - run: pip install ruff
      - run: ruff check --config server/pyproject.toml server/src/ install/ scripts/ --output-format=github

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-2022]
        exclude:
          - os: windows-2022
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install server with dev deps
        working-directory: server
        run: pip install ".[dev]"

      - name: Run server unit tests (with coverage)
        if: matrix.python-version == '3.12'
        working-directory: server
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest tests/ -m "not live and not monkey" -q --tb=short --cov=unity_mcp --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=reports/server-junit.xml

      - name: Run server unit tests
        if: matrix.python-version != '3.12'
        working-directory: server
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest tests/ -m "not live and not monkey" -q --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45  # v5
        with:
          files: server/coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run install tests (with junit)
        if: matrix.python-version == '3.12'
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest install/tests/ -q --tb=short --junitxml=server/reports/install-junit.xml

      - name: Run install tests
        if: matrix.python-version != '3.12'
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest install/tests/ -q --tb=short

      - name: Run scripts tests (with junit)
        if: matrix.python-version == '3.12'
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest scripts/tests/ -q --tb=short --junitxml=server/reports/scripts-junit.xml

      - name: Run scripts tests
        if: matrix.python-version != '3.12'
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest scripts/tests/ -q --tb=short

      - name: Collect test results
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python scripts/collect_test_results.py --add-pytest server/reports/server-junit.xml --suite "Python Server (3.12)" --platform linux --out server/reports/tests.json
          python scripts/collect_test_results.py --add-pytest server/reports/install-junit.xml --suite "Python Install" --platform linux --out server/reports/tests.json
          python scripts/collect_test_results.py --add-pytest server/reports/scripts-junit.xml --suite "Python Scripts" --platform linux --out server/reports/tests.json

      - name: Upload test analytics to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45  # v5
        with:
          files: server/reports/server-junit.xml,server/reports/install-junit.xml,server/reports/scripts-junit.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload test results
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results
          path: server/reports/tests.json
          retention-days: 30

  readme-check:
    name: README check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install server (needed for fact collection)
        working-directory: server
        run: pip install ".[dev]"

      - name: Check facts
        run: python scripts/update_readme.py --check-facts

      - name: Check rendered outputs
        run: python scripts/update_readme.py --check

  tool-quality:
    name: Tool Quality
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install server
        working-directory: server
        run: pip install ".[dev]"

      - name: Install mcp-tool-card-linter
        run: pip install mcp-tool-card-linter==1.0.0

      - name: Export tools (toolsmith format)
        run: python scripts/export_tools.py --format toolsmith --out reports/tools-toolsmith.json

      - name: Export tools (mcplint format)
        run: python scripts/export_tools.py --format mcplint --out reports/tools-mcplint.json

      - name: Run mcp-tool-card-linter
        run: mcp-toolsmith lint --tools-file reports/tools-toolsmith.json --json-report reports/toolsmith.json --fail-on never

      - name: Run mcp-lint
        run: npx -y mcp-lint@0.5.3 check reports/tools-mcplint.json > reports/mcplint.txt 2>&1 || true

      - name: Compute quality delta
        run: |
          python scripts/quality_delta.py \
            --toolsmith reports/toolsmith.json \
            --mcplint reports/mcplint.txt \
            --history docs/quality/data/history.json \
            --out-latest docs/quality/data/latest.json \
            --out-comment reports/pr-comment.md \
            --out-badge .github/badges/quality.json \
            || true

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tool-quality-reports
          path: reports/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: reports/pr-comment.md
          comment-tag: tool-quality-report

  badge:
    name: Update badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, tool-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install server (needed for fact collection)
        working-directory: server
        run: pip install ".[dev]"

      - name: Regenerate badges
        run: python scripts/update_readme.py --all

      - name: Install mcp-tool-card-linter
        run: pip install mcp-tool-card-linter==1.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: test-results
          path: reports/
        continue-on-error: true

      - name: Export tools
        run: |
          python scripts/export_tools.py --format toolsmith --out reports/tools-toolsmith.json
          python scripts/export_tools.py --format mcplint --out reports/tools-mcplint.json

      - name: Run linters
        run: |
          mcp-toolsmith lint --tools-file reports/tools-toolsmith.json --json-report reports/toolsmith.json --fail-on never
          npx -y mcp-lint@0.5.3 check reports/tools-mcplint.json > reports/mcplint.txt 2>&1 || true

      - name: Generate quality data
        run: |
          TEST_ARGS=""
          for f in reports/tests.json docs/quality/data/unity-tests.json; do
            [ -f "$f" ] && TEST_ARGS="$TEST_ARGS $f"
          done
          python scripts/quality_delta.py \
            --toolsmith reports/toolsmith.json \
            --mcplint reports/mcplint.txt \
            --history docs/quality/data/history.json \
            --out-latest docs/quality/data/latest.json \
            --out-comment reports/pr-comment.md \
            --out-badge .github/badges/quality.json \
            --out-report docs/quality/REPORT.md \
            ${TEST_ARGS:+--test-results $TEST_ARGS} \
            || echo "::warning::Quality regression detected"
          python scripts/quality_delta.py --append \
            --latest docs/quality/data/latest.json \
            --history docs/quality/data/history.json

      - name: Generate tool schema page
        run: |
          python scripts/generate_schema_page.py \
            --tools reports/tools-toolsmith.json \
            --scores reports/toolsmith.json \
            --out docs/tools-schema/index.md

      - name: Commit badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/*.json docs/quality/data/*.json docs/quality/REPORT.md docs/tools-schema/index.md
          git diff --staged --quiet && echo "No badge changes" && exit 0
          git commit -m "chore: update badges + quality data [skip ci]"
          git pull --rebase -X theirs origin master
          git push
