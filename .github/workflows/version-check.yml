name: Version check

on:
  pull_request:
    branches: [master]
    paths:
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "unity-plugin/package.json"
      - "server/src/unity_mcp/__version__.py"
      - "unity-plugin/Editor/MCPServer.cs"
      - "docs/assets/_meta.json"
      - "CHANGELOG.md"
      - "unity-plugin/CHANGELOG.md"
      - "scripts/sync_changelog.py"

permissions:
  contents: read

jobs:
  check:
    name: Version sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Check version artifacts in sync
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python scripts/sync_versions.py --check

      - name: Check changelogs match
        run: python scripts/sync_changelog.py --check
