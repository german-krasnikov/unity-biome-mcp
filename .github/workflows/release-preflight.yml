name: release-preflight

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to check (e.g. 1.12.0)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install -e "server[dev]"
          pip install mcp-tool-card-linter==1.0.0

      - name: Tool quality gate (soft)
        run: |
          python scripts/export_tools.py --format toolsmith --out /tmp/tools-toolsmith.json
          mcp-toolsmith lint --tools-file /tmp/tools-toolsmith.json --json-report /tmp/toolsmith.json --fail-on never
          python scripts/quality_delta.py \
            --toolsmith /tmp/toolsmith.json \
            --history docs/quality/data/history.json \
            --out-latest /tmp/latest.json \
            --out-comment /tmp/pr-comment.md \
            --out-badge /tmp/quality.json || echo "::warning::Quality regression detected"

      - name: Run preflight
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            bash scripts/release.sh --preflight "$VERSION_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash scripts/release.sh --preflight "${GITHUB_REF_NAME#v}"
          else
            bash scripts/release.sh --preflight
          fi

      - name: Conformance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$GITHUB_SHA"
          echo "Release target SHA: $TARGET_SHA"

          RESULTS=$(gh run list \
            --workflow ci-conformance.yml \
            --branch master \
            --status success \
            --limit 10 \
            --json headSha,createdAt \
            --jq '.[] | "\(.headSha)|\(.createdAt)"' 2>/dev/null || echo "")

          if [ -z "$RESULTS" ]; then
            echo "::error::No successful conformance run found on master."
            exit 1
          fi

          PASSED=""
          while IFS='|' read -r RUN_SHA CREATED; do
            if git merge-base --is-ancestor "$RUN_SHA" "$TARGET_SHA" 2>/dev/null; then
              PASSED="$RUN_SHA"
              echo "Conformance gate passed: sha=$RUN_SHA created=$CREATED (ancestor of $TARGET_SHA)"
              break
            fi
          done <<< "$RESULTS"

          if [ -z "$PASSED" ]; then
            echo "::error::No successful conformance run is an ancestor of $TARGET_SHA."
            echo "::error::Run: gh workflow run ci-conformance.yml --ref master"
            exit 1
          fi
