name: release-preflight

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to check (e.g. 1.12.0)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e "server[dev]"
          pip install mcp-tool-card-linter==1.0.0

      - name: Tool quality gate (soft)
        run: |
          python scripts/export_tools.py --format toolsmith --out /tmp/tools-toolsmith.json
          mcp-toolsmith lint --tools-file /tmp/tools-toolsmith.json --json-report /tmp/toolsmith.json --fail-on never
          python scripts/quality_delta.py \
            --toolsmith /tmp/toolsmith.json \
            --history docs/quality/data/history.json \
            --out-latest /tmp/latest.json \
            --out-comment /tmp/pr-comment.md \
            --out-badge /tmp/quality.json || echo "::warning::Quality regression detected"

      - name: Run preflight
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            bash scripts/release.sh --preflight "$VERSION_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash scripts/release.sh --preflight "${GITHUB_REF_NAME#v}"
          else
            bash scripts/release.sh --preflight
          fi

      - name: Conformance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh run list \
            --workflow ci-conformance.yml \
            --branch master \
            --status completed \
            --limit 1 \
            --json conclusion,headSha,createdAt \
            --jq '.[0] | "\(.conclusion)|\(.headSha)|\(.createdAt)"' 2>/dev/null || echo "")

          if [ -z "$RESULT" ]; then
            echo "::error::No completed conformance run found on master."
            exit 1
          fi

          CONCLUSION="${RESULT%%|*}"
          REST="${RESULT#*|}"
          RUN_SHA="${REST%%|*}"
          CREATED="${REST#*|}"

          echo "Last conformance run: conclusion=$CONCLUSION sha=$RUN_SHA created=$CREATED"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Last conformance run on master was '$CONCLUSION' — release blocked."
            exit 1
          fi

          if [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Conformance passed on $RUN_SHA, not on release SHA $GITHUB_SHA."
            exit 1
          fi
          echo "Conformance gate passed."
