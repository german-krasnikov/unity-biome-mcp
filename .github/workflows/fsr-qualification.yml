name: FSR Qualification Matrix

# P1-20: frozen compatibility matrix, narrowed after run 5 (coordinator
# decision, see scripts/fsr_qualification_lock.json "qualified_windows"):
# u_min (6000.0.65f1) on macOS/Linux is the qualifying pair; u_max
# (6000.5.10f1, a staging-branch build) hung in the fixture-free pilot
# unrelated to any fix applied here and is shelved to P2-07, not run.
# Windows stays in the matrix as a documented, non-blocking
# INFRASTRUCTURE_BLOCKED limitation (window-station-for-headed-GUI gap in
# the GH-hosted runner service context) — required to produce an honest
# receipt, never required to PASS. Advisory only — workflow_dispatch (plus
# a temporary path-scoped push trigger, see below), never required until a
# second unchanged aggregate PASS promotes it. See
# Plans/HotReload/V2/FSR-MVP-CLEAN/04-PARETO-COMPLETION-HANDOFF.md §7 P1-20.
#
# Existing unity-tests.yml/unity-compat.yml/ci-conformance.yml batchmode
# lanes are setup/license/cache patterns only, not FSR qualification
# evidence — every cell here launches Unity headed (no -batchmode
# -nographics): a direct GUI supervisor, per the plan's explicit
# requirement.
on:
  workflow_dispatch: {}
  # temporary trigger: workflow_dispatch requires the file on the default
  # branch; remove the push trigger (or land on default) after the first
  # recorded aggregate PASS.
  push:
    branches: [feature/mutation-fsr-mvp]
    paths:
      - '.github/workflows/fsr-qualification.yml'
      - 'scripts/fsr_qualification_lock.json'
      - 'scripts/run_fsr_qualification_cell.py'
      - 'scripts/gauntlet/fsr_qualification.py'
      - 'scripts/gauntlet/fsr_qualification_fixture.py'
      - 'scripts/fixtures/fsr_qualification/**'

concurrency:
  group: fsr-qualification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cell:
    name: "${{ matrix.cell }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: min-macos-arm64
            window: u_min
            runner: macos-15
            os_name: macOS
            arch: arm64
            hub-version: ''
          - cell: min-windows-x64
            window: u_min
            runner: windows-2022
            os_name: Windows
            arch: x64
            hub-version: ''
          - cell: min-linux-x64
            window: u_min
            runner: ubuntu-24.04
            os_name: Linux
            arch: x64
            # pin: 3.20.0 regresses /opt/unityhub/unityhub path on Linux
            # (issue #57) — same pin already proven by unity-tests.yml /
            # unity-compat.yml / ci-conformance.yml.
            hub-version: '3.19.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: run_fsr_qualification_cell.py and
          # validate_fsr_qualification_receipts.py both run
          # `git diff --name-only <base_product_sha>..HEAD` (the
          # aggregate base-SHA-untouched guard) — the default shallow
          # clone (fetch-depth: 1) has no history reaching the frozen
          # base and fails closed with exit 128 on every cell.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Resolve frozen cell Unity version from the lock
        id: cell
        shell: bash
        run: |
          python - "${{ matrix.window }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          lock = json.load(open("scripts/fsr_qualification_lock.json"))
          entry = lock["cells"][sys.argv[1]]
          print(f"unity_version={entry['unity_version']} ({entry['unity_revision']})")
          PY

      - name: Start owned Xvfb (Linux only — direct GUI supervisor needs a display)
        if: runner.os == 'Linux'
        id: xvfb
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "xvfb_pid=$!" >> "$GITHUB_OUTPUT"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Install VC++ 2010 runtime (Unity 6 dependency)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install vcredist2010 -y

      - name: Install server with dev deps
        shell: bash
        run: pip install -e "server[dev]"

      - name: Set UPM cache path
        id: upm-path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "path=$HOME/Library/Caches/Unity/upm" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"
          else
            echo "path=$LOCALAPPDATA/Unity/cache/upm" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache UPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: fsr-qualification-upm-${{ matrix.cell }}-${{ hashFiles('scripts/fsr_qualification_lock.json') }}
          restore-keys: |
            fsr-qualification-upm-${{ matrix.cell }}-

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b  # v2
        id: unity-setup
        timeout-minutes: 40
        continue-on-error: true
        with:
          unity-version: ${{ steps.cell.outputs.unity_version }}
          cache-installation: true
          hub-version: ${{ matrix.hub-version }}

      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af  # v2
        id: license
        if: steps.unity-setup.outcome == 'success'
        continue-on-error: true
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Fixture-free GUI baseline (pilot)
        id: pilot
        if: steps.unity-setup.outcome == 'success' && steps.license.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.cell }}/pilot"
          python scripts/run_fsr_qualification_cell.py \
            --mode pilot \
            --unity "${{ steps.unity-setup.outputs.unity-editor-path }}" \
            --work-root "$RUNNER_TEMP/fsr-pilot-${{ matrix.cell }}-${{ github.run_id }}" \
            --window ${{ matrix.window }} \
            --lock scripts/fsr_qualification_lock.json \
            --evidence-out "artifacts/${{ matrix.cell }}/pilot" \
            --cell-name ${{ matrix.cell }} \
            --os-name ${{ matrix.os_name }} \
            --arch ${{ matrix.arch }} \
            --port 9600 \
            --startup-timeout 900

      - name: Run cell scenario
        id: run-cell
        if: steps.pilot.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.cell }}"
          python scripts/run_fsr_qualification_cell.py \
            --mode full \
            --unity "${{ steps.unity-setup.outputs.unity-editor-path }}" \
            --work-root "$RUNNER_TEMP/fsr-cell-${{ matrix.cell }}-${{ github.run_id }}" \
            --window ${{ matrix.window }} \
            --lock scripts/fsr_qualification_lock.json \
            --provider-pin scripts/source_patch_provider_pin.json \
            --evidence-out "artifacts/${{ matrix.cell }}" \
            --cell-name ${{ matrix.cell }} \
            --os-name ${{ matrix.os_name }} \
            --arch ${{ matrix.arch }} \
            --port 9600 \
            --startup-timeout 900

      - name: Stop owned Xvfb
        if: always() && runner.os == 'Linux' && steps.xvfb.outputs.xvfb_pid != ''
        shell: bash
        run: kill "${{ steps.xvfb.outputs.xvfb_pid }}" || true

      # A missing secret or failed setup/license/pilot is a failed
      # INFRASTRUCTURE_BLOCKED cell, never a green skip (§7 P1-20). This
      # step only fires when run-cell itself never produced a receipt.json.
      - name: Write INFRASTRUCTURE_BLOCKED receipt when no cell receipt exists
        if: always()
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.cell }}"
          if [ ! -f "artifacts/${{ matrix.cell }}/receipt.json" ]; then
            python - <<'PY'
          import json
          payload = {
              "cell": "${{ matrix.cell }}",
              "os": "${{ matrix.os_name }}",
              "arch": "${{ matrix.arch }}",
              "outcome": "INFRASTRUCTURE_BLOCKED",
              "setup_ok": "${{ steps.unity-setup.outcome }}" == "success",
              "license_ok": "${{ steps.license.outcome }}" == "success",
              "display_ok": "${{ steps.pilot.outcome }}" == "success",
          }
          with open("artifacts/${{ matrix.cell }}/receipt.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          fi

      - name: Fail the job on a non-PASS receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          payload = json.load(open("artifacts/${{ matrix.cell }}/receipt.json"))
          outcome = payload.get("outcome")
          print(f"cell=${{ matrix.cell }} outcome={outcome}")
          sys.exit(0 if outcome == "PASS" else 1)
          PY

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fsr-qualification-${{ matrix.cell }}
          path: artifacts/${{ matrix.cell }}/
          retention-days: 30

  aggregate:
    name: Aggregate (2/2 required-pass + Windows documented-blocked)
    needs: [cell]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: run_fsr_qualification_cell.py and
          # validate_fsr_qualification_receipts.py both run
          # `git diff --name-only <base_product_sha>..HEAD` (the
          # aggregate base-SHA-untouched guard) — the default shallow
          # clone (fetch-depth: 1) has no history reaching the frozen
          # base and fails closed with exit 128 on every cell.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: fsr-qualification-*
          path: receipts

      - name: Assert 2/2 required-pass receipts + one documented-blocked Windows receipt
        shell: bash
        run: |
          python scripts/validate_fsr_qualification_receipts.py \
            --receipts-root receipts \
            --lock scripts/fsr_qualification_lock.json
