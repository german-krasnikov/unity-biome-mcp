name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e "server[dev]"

      - name: Run release preflight
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bash scripts/release.sh --preflight "${TAG_NAME#v}"

      - name: Conformance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh run list \
            --workflow ci-conformance.yml \
            --branch master \
            --status completed \
            --limit 1 \
            --json conclusion,headSha,createdAt \
            --jq '.[0] | "\(.conclusion)|\(.headSha)|\(.createdAt)"' 2>/dev/null || echo "")

          if [ -z "$RESULT" ]; then
            echo "::error::No completed conformance run found on master."
            exit 1
          fi

          CONCLUSION="${RESULT%%|*}"
          REST="${RESULT#*|}"
          RUN_SHA="${REST%%|*}"
          CREATED="${REST#*|}"

          echo "Last conformance run: conclusion=$CONCLUSION sha=$RUN_SHA created=$CREATED"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Last conformance run on master was '$CONCLUSION' — release blocked."
            exit 1
          fi

          if [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Conformance passed on $RUN_SHA, not on release SHA $GITHUB_SHA."
            exit 1
          fi
          echo "Conformance gate passed."

  publish:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Extract changelog section
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import pathlib, re, os
          tag = os.environ['TAG_NAME']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'(## \[{re.escape(tag)}\].*?)(?=\n## \[v|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          if not match:
              print(f'::warning::No CHANGELOG section found for {tag}')
              body = f'Release {tag}'
          else:
              body = match.group(1).strip()
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as f:
              f.write('body<<CHANGELOG_EOF\n')
              f.write(body + '\n')
              f.write('CHANGELOG_EOF\n')
          "

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
