name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.29.0)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e "server[dev]"

      - name: Run release preflight
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/release.sh --preflight "${TAG_NAME#v}"

      - name: Conformance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}" 2>/dev/null || true)
            [ -z "$TARGET_SHA" ] && { echo "::error::Cannot resolve tag '${{ inputs.tag }}'"; exit 1; }
          else
            TARGET_SHA="$GITHUB_SHA"
          fi
          echo "Release target SHA: $TARGET_SHA"

          RESULTS=$(gh run list \
            --workflow ci-conformance.yml \
            --branch master \
            --status success \
            --limit 10 \
            --json headSha,createdAt \
            --jq '.[] | "\(.headSha)|\(.createdAt)"' 2>/dev/null || echo "")

          if [ -z "$RESULTS" ]; then
            echo "::error::No successful conformance run found on master."
            exit 1
          fi

          PASSED=""
          while IFS='|' read -r RUN_SHA CREATED; do
            if git merge-base --is-ancestor "$RUN_SHA" "$TARGET_SHA" 2>/dev/null; then
              PASSED="$RUN_SHA"
              echo "Conformance gate passed: sha=$RUN_SHA created=$CREATED (ancestor of $TARGET_SHA)"
              break
            fi
          done <<< "$RESULTS"

          if [ -z "$PASSED" ]; then
            echo "::error::No successful conformance run is an ancestor of $TARGET_SHA."
            echo "::error::Run: gh workflow run ci-conformance.yml --ref master"
            exit 1
          fi

  publish:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Extract changelog section
        id: changelog
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 -c "
          import pathlib, re, os
          tag = os.environ['TAG_NAME']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'(## \[{re.escape(tag)}\].*?)(?=\n## \[v|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          if not match:
              print(f'::warning::No CHANGELOG section found for {tag}')
              body = f'Release {tag}'
          else:
              body = match.group(1).strip()
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as f:
              f.write('body<<CHANGELOG_EOF\n')
              f.write(body + '\n')
              f.write('CHANGELOG_EOF\n')
          "

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
