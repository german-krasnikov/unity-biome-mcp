name: Unity EditMode Tests

on:
  push:
    branches: [master, "feat/**", "feature/**", "fix/**"]
    paths:
      - "unity-plugin/**"
      - "unity-test-project/**"
      - "unity-test-project/Playtests/**"
      - ".github/workflows/unity-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "unity-plugin/**"
      - "unity-test-project/**"
      - "unity-test-project/Playtests/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch:
    inputs:
      run_player_playtest:
        description: "Also run the standalone Player PlayTest workflow."
        required: false
        default: "false"
      run_player_graphics_smoke:
        description: "Also run the optional graphics/UI player smoke inside the player workflow."
        required: false
        default: "false"

concurrency:
  group: unity-tests-${{ github.head_ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_player_playtest == 'true' && github.run_id || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: EditMode Tests (${{ matrix.name }})
    if: github.event_name != 'workflow_dispatch' || inputs.run_player_playtest != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build-target: StandaloneLinux64
            build-output: artifacts/player-smoke/UnityMCP
            hub-version: '3.19.5'
            coverage-args: >-
              -enableCodeCoverage
              -coverageOptions assemblyFilters:+UnityMCP*,-*Tests*,-*TestSupport*,-*TestHelpers*;generateAdditionalMetrics
          - name: macOS
            runner: macos-latest
            build-target: StandaloneOSX
            build-output: artifacts/player-smoke/UnityMCP.app
            hub-version: ''
            coverage-args: ''
          - name: Windows
            runner: windows-2022
            build-target: StandaloneWindows64
            build-output: artifacts/player-smoke/UnityMCP.exe
            hub-version: ''
            coverage-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install VC++ 2010 runtime (Unity 6 dependency)
        if: |
          runner.os == 'Windows' &&
          (github.event_name != 'pull_request' || matrix.name == 'Linux')
        shell: powershell
        run: choco install vcredist2010 -y

      - name: Create artifacts directory
        shell: bash
        run: mkdir -p artifacts

      - name: Set UPM cache path
        id: upm-path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "path=$HOME/Library/Caches/Unity/upm" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"
          else
            echo "path=$LOCALAPPDATA/Unity/cache/upm" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache UPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: upm-${{ runner.os }}-${{ hashFiles('unity-test-project/Packages/packages-lock.json') }}
          restore-keys: |
            upm-${{ runner.os }}-

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            unity-test-project/Library/Artifacts
            unity-test-project/Library/ArtifactDB
            unity-test-project/Library/SourceAssetDB
            unity-test-project/Library/ScriptAssemblies
            unity-test-project/Library/StateCache
          # key excludes C# source on purpose; Unity's ArtifactDB inside the cached Artifacts/ drives incremental recompilation
          key: unity-library-${{ runner.os }}-${{ hashFiles('unity-test-project/Packages/packages-lock.json', 'unity-test-project/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b  # v2
        id: unity-setup
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        timeout-minutes: 60
        with:
          unity-version: 6000.0.65f1
          build-targets: ${{ matrix.build-target }}
          cache-installation: ${{ runner.os != 'Windows' }}
          hub-version: ${{ matrix.hub-version }}

      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af  # v2
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a  # v3
        name: Run EditMode Tests
        if: github.event_name != 'pull_request' || matrix.name == 'Linux'
        with:
          build-target: ${{ matrix.build-target }}
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: unity-test-project
          args: >
            -batchmode
            -nographics
            -runTests
            -testPlatform EditMode
            -testResults ${{ github.workspace }}/artifacts/editmode-results.xml
            -logFile ${{ github.workspace }}/artifacts/unity.log
            ${{ matrix.coverage-args }}

      - name: Check test results exist
        id: check-results
        if: always()
        shell: bash
        run: test -f artifacts/editmode-results.xml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        if: always() && steps.check-results.outputs.exists == 'true'
        with:
          name: NUnit Results (${{ matrix.name }})
          path: artifacts/*.xml
          reporter: dotnet-nunit

      - name: Write job summary
        if: always() && steps.check-results.outputs.exists == 'true'
        shell: python
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          import xml.etree.ElementTree as ET, os
          r = ET.parse('artifacts/editmode-results.xml').getroot()
          passed  = r.get('passed',  '?')
          failed  = r.get('failed',  '?')
          skipped = r.get('skipped', '?')
          total   = r.get('total',   '?')
          if int(total) == 0:
              raise SystemExit('Unity EditMode test run executed zero tests')
          icon    = '✅' if int(r.get('failed', '1')) == 0 else '❌'
          name    = os.environ['MATRIX_NAME']
          if int(skipped) > 0:
              print(f'::warning::{skipped} test(s) skipped on {name} leg — verify none regress a Windows-only fix')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'## {icon} EditMode Tests — {name}\n\n')
              f.write('| Passed | Failed | Skipped | Total |\n')
              f.write('|:------:|:------:|:-------:|:-----:|\n')
              f.write(f'| **{passed}** | **{failed}** | {skipped} | {total} |\n\n')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: artifacts/

      - name: Upload coverage data artifact (Linux only)
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data-Linux
          path: unity-test-project/CodeCoverage/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: unity-log-${{ matrix.name }}
          path: artifacts/unity.log

  player-playtest:
    name: Optional standalone Player PlayTest
    if: github.event_name == 'workflow_dispatch' && inputs.run_player_playtest == 'true'
    uses: ./.github/workflows/unity-player-playtest.yml
    with:
      run_graphics_smoke: ${{ inputs.run_player_graphics_smoke == 'true' }}
    secrets: inherit

  upload-coverage:
    name: Upload Coverage to Codecov (Linux)
    needs: [test]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 10
    steps:
      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-data-Linux
          path: coverage/
        continue-on-error: true

      - name: Download test results (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-results-Linux
          path: artifacts/
        continue-on-error: true

      - name: Find coverage reports
        id: cov-files
        shell: bash
        run: |
          files=$(find coverage -name '*.xml' -type f 2>/dev/null | paste -sd ',' -)
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Upload C# coverage to Codecov
        if: steps.cov-files.outputs.files != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          files: ${{ steps.cov-files.outputs.files }}
          flags: csharp
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload test analytics to Codecov
        if: hashFiles('artifacts/editmode-results.xml') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          files: artifacts/editmode-results.xml
          flags: csharp
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
        continue-on-error: true

  aggregate:
    name: Aggregate C# test results
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: test-results-*
          path: dl/
          merge-multiple: false

      - name: Merge C# test results
        shell: bash
        run: |
          for dir in dl/test-results-*/; do
            platform=$(basename "$dir" | sed 's/test-results-//')
            xml="$dir/editmode-results.xml"
            if [ -f "$xml" ]; then
              python scripts/collect_test_results.py \
                --add-nunit "$xml" \
                --suite "C# EditMode ($platform)" \
                --platform "$platform" \
                --out docs/quality/data/unity-tests.json
            fi
          done

      - name: Commit C# test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quality/data/unity-tests.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update C# test results [skip ci]"
          git pull --rebase -X theirs origin master
          git push
