name: Unity EditMode Tests

on:
  push:
    branches: [master, "feat/**", "feature/**", "fix/**"]
    paths:
      - "unity-plugin/**"
      - "unity-test-project/**"
      - "unity-test-project/Playtests/**"
      - ".github/workflows/unity-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "unity-plugin/**"
      - "unity-test-project/**"
      - "unity-test-project/Playtests/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: EditMode Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build-target: StandaloneLinux64
            build-output: artifacts/player-smoke/UnityMCP
            hub-version: '3.19.5'
            coverage-args: >-
              -enableCodeCoverage
              -coverageOptions assemblyFilters:+UnityMCP*,-*Tests*,-*TestSupport*,-*TestHelpers*;generateAdditionalMetrics
          - name: macOS
            runner: macos-latest
            build-target: StandaloneOSX
            build-output: artifacts/player-smoke/UnityMCP.app
            hub-version: ''
            coverage-args: ''
          - name: Windows
            runner: windows-2022
            build-target: StandaloneWindows64
            build-output: artifacts/player-smoke/UnityMCP.exe
            hub-version: ''
            coverage-args: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install VC++ 2010 runtime (Unity 6 dependency)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install vcredist2010 -y

      - name: Create artifacts directory
        shell: bash
        run: mkdir -p artifacts

      - name: Set UPM cache path
        id: upm-path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "path=$HOME/Library/Caches/Unity/upm" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "path=$HOME/.cache/Unity/upm" >> "$GITHUB_OUTPUT"
          else
            echo "path=$LOCALAPPDATA/Unity/cache/upm" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache UPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ steps.upm-path.outputs.path }}
          key: upm-${{ runner.os }}-${{ hashFiles('unity-test-project/Packages/packages-lock.json') }}
          restore-keys: |
            upm-${{ runner.os }}-
      - uses: buildalon/unity-setup@1a2acb0efbce77c0f90b79ced6a9c6a37ae534c2  # v2
        id: unity-setup
        with:
          unity-version: 6000.0.65f1
          build-targets: ${{ matrix.build-target }}
          cache-installation: ${{ runner.os != 'Windows' }}
          hub-version: ${{ matrix.hub-version }}

      - uses: buildalon/activate-unity-license@87b3a82bac7ca7609eacdb2bec31c8a8a142ed9a  # v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: buildalon/unity-action@4de595732434e4da7726086a95a75eda832bd03d  # v3
        name: Run EditMode Tests
        with:
          build-target: ${{ matrix.build-target }}
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: unity-test-project
          args: >
            -batchmode
            -nographics
            -runTests
            -testPlatform EditMode
            -testResults ${{ github.workspace }}/artifacts/editmode-results.xml
            -logFile ${{ github.workspace }}/artifacts/unity.log
            -testFilter "cat!=FaultInjection&&cat!=LiveCLI&&cat!=RequiresGraphics&&cat!=InteractiveVisual&&cat!=WorkerOnly"
            ${{ matrix.coverage-args }}

      - uses: buildalon/unity-action@4de595732434e4da7726086a95a75eda832bd03d  # v3
        name: Build Standalone Player Smoke
        with:
          build-target: ${{ matrix.build-target }}
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: unity-test-project
          args: >
            -batchmode
            -nographics
            -executeMethod UnityMCP.CI.CiBuildSmoke.Build
            -ciBuildOutput ${{ github.workspace }}/${{ matrix.build-output }}
            -logFile ${{ github.workspace }}/artifacts/player-build.log

      - name: Run Player PlayTest Smoke
        shell: bash
        run: |
          PLAYER="${{ matrix.build-output }}"
          if [[ "$PLAYER" == *.app ]]; then
            PLAYER=$(find "$PLAYER/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -1)
          fi
          test -n "$PLAYER"
          chmod +x "$PLAYER" 2>/dev/null || true
          "$PLAYER" \
            -batchmode \
            -nographics \
            -unityMcpPlaytest "${{ github.workspace }}/unity-test-project/Assets/StreamingAssets/Playtests/player_ci_smoke.playtest" \
            -unityMcpPlaytestJson "${{ github.workspace }}/artifacts/player-playtest.json" \
            -unityMcpPlaytestJunit "${{ github.workspace }}/artifacts/player-playtest.xml" \
            -unityMcpPlaytestExit

      - name: Validate Player PlayTest Receipts
        shell: python
        run: |
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          json_path = Path("artifacts/player-playtest.json")
          junit_path = Path("artifacts/player-playtest.xml")
          raw_json = json_path.read_bytes()
          if raw_json.startswith(b"\xef\xbb\xbf"):
              raise SystemExit("player JSON receipt must be UTF-8 without BOM")
          payload = json.loads(raw_json.decode("utf-8"))
          if payload.get("failed") != 0:
              raise SystemExit(f"player PlayTest failed: {payload!r}")
          if not payload.get("steps"):
              raise SystemExit("player PlayTest emitted no step receipts")
          suite = ET.parse(junit_path).getroot()
          if suite.get("name") != "UnityMCP.PlayerPlaytest":
              raise SystemExit(f"unexpected JUnit suite: {suite.get('name')!r}")
          if suite.get("failures") != "0":
              raise SystemExit(ET.tostring(suite, encoding="unicode"))

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: player-build-${{ matrix.name }}
          path: |
            ${{ matrix.build-output }}
            artifacts/player-build.log
            artifacts/player-playtest.json
            artifacts/player-playtest.xml
          if-no-files-found: warn

      - name: Check test results exist
        id: check-results
        if: always()
        shell: bash
        run: test -f artifacts/editmode-results.xml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc  # v1
        if: always() && steps.check-results.outputs.exists == 'true'
        with:
          name: NUnit Results (${{ matrix.name }})
          path: artifacts/*.xml
          reporter: dotnet-nunit

      - name: Write job summary
        if: always() && steps.check-results.outputs.exists == 'true'
        shell: python
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          import xml.etree.ElementTree as ET, os
          r = ET.parse('artifacts/editmode-results.xml').getroot()
          passed  = r.get('passed',  '?')
          failed  = r.get('failed',  '?')
          skipped = r.get('skipped', '?')
          total   = r.get('total',   '?')
          icon    = '✅' if int(r.get('failed', '1')) == 0 else '❌'
          name    = os.environ['MATRIX_NAME']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'## {icon} EditMode Tests — {name}\n\n')
              f.write('| Passed | Failed | Skipped | Total |\n')
              f.write('|:------:|:------:|:-------:|:-----:|\n')
              f.write(f'| **{passed}** | **{failed}** | {skipped} | {total} |\n\n')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: artifacts/

      - name: Find coverage reports
        if: matrix.name == 'Linux'
        id: cov-files
        shell: bash
        run: echo "files=$(find unity-test-project/CodeCoverage -name '*.xml' -type f | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Upload C# coverage to Codecov
        if: matrix.name == 'Linux' && steps.cov-files.outputs.files != ''
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45  # v5
        with:
          files: ${{ steps.cov-files.outputs.files }}
          flags: csharp
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test analytics to Codecov
        if: matrix.name == 'Linux' && !cancelled()
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45  # v5
        with:
          files: artifacts/editmode-results.xml
          flags: csharp
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: unity-log-${{ matrix.name }}
          path: artifacts/unity.log

  aggregate:
    name: Aggregate C# test results
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Download all test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: test-results-*
          path: dl/
          merge-multiple: false

      - name: Merge C# test results
        shell: bash
        run: |
          for dir in dl/test-results-*/; do
            platform=$(basename "$dir" | sed 's/test-results-//')
            xml="$dir/editmode-results.xml"
            if [ -f "$xml" ]; then
              python scripts/collect_test_results.py \
                --add-nunit "$xml" \
                --suite "C# EditMode ($platform)" \
                --platform "$platform" \
                --out docs/quality/data/unity-tests.json
            fi
          done

      - name: Commit C# test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quality/data/unity-tests.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update C# test results [skip ci]"
          git pull --rebase -X theirs origin master
          git push
