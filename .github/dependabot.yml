version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "german-krasnikov"
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns:
          - "mcp"
      testing:
        patterns:
          - "pytest*"
    ignore:
      # mcp pinned <2 — skip major bumps
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "german-krasnikov"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
