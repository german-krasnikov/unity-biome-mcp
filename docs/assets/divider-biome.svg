<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 36" width="860" height="36"
     role="img" aria-labelledby="divider-title divider-desc">
  <title id="divider-title">Biome signal divider</title>
  <desc id="divider-desc">A live signal travels through a softly pulsing Biome hub with drifting particles.</desc>
  <defs>
    <linearGradient id="biome-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242424"/>
      <stop offset=".18" stop-color="#4aa4f7" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#46e6a6"/>
      <stop offset=".82" stop-color="#f3a634" stop-opacity=".45"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <filter id="biome-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <style>
    .signal {
      animation: signal-flow 4.8s linear infinite;
      stroke-dasharray: 72 32 10 24;
    }
    .hub-aura {
      animation: hub-aura 2.9s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hub {
      animation: hub-life 3.7s cubic-bezier(.45, 0, .55, 1) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .particle {
      animation: particle-a 4.3s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    .particle:nth-of-type(2n) { animation-name: particle-b; animation-duration: 5.1s; }
    .particle:nth-of-type(3n) { animation-name: particle-c; animation-duration: 3.6s; }
    @keyframes signal-flow {
      to { stroke-dashoffset: -276; }
    }
    @keyframes hub-aura {
      0%, 100% { opacity: .12; transform: scale(.78); }
      50% { opacity: .42; transform: scale(1.22); }
    }
    @keyframes hub-life {
      0%, 100% { transform: rotate(45deg) scale(.92); }
      38% { transform: rotate(49deg) scale(1.08); }
      68% { transform: rotate(42deg) scale(.98); }
    }
    @keyframes particle-a {
      0% { opacity: .18; transform: translate(-4px, 2px) scale(.75); }
      52% { opacity: .82; transform: translate(3px, -3px) scale(1.15); }
      100% { opacity: .32; transform: translate(7px, 1px) scale(.9); }
    }
    @keyframes particle-b {
      0% { opacity: .12; transform: translate(3px, -2px) scale(.7); }
      43% { opacity: .65; transform: translate(-6px, 3px) scale(1.2); }
      100% { opacity: .28; transform: translate(2px, -4px) scale(.85); }
    }
    @keyframes particle-c {
      0% { opacity: .2; transform: translate(-2px, -3px) scale(.8); }
      61% { opacity: .72; transform: translate(5px, 2px) scale(1.1); }
      100% { opacity: .16; transform: translate(-5px, 4px) scale(.72); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .hub-aura, .hub, .particle { animation: none !important; }
      .particle { opacity: .32; }
      .hub-aura { opacity: .2; }
    }
  </style>

  <rect width="860" height="36" fill="#242424"/>
  <path d="M24 18H836" fill="none" stroke="#3b3b3b" stroke-width="1"/>
  <path class="signal" d="M24 18H836" fill="none" stroke="url(#biome-line)"
        stroke-width="2" stroke-linecap="round"/>

  <circle cx="122" cy="18" r="3" fill="#4aa4f7"/>
  <circle cx="738" cy="18" r="3" fill="#f3a634"/>
  <circle class="hub-aura" cx="430" cy="18" r="12" fill="#46e6a6"
          filter="url(#biome-glow)"/>
  <rect class="hub" x="423" y="11" width="14" height="14" rx="2"
        fill="#242424" stroke="#46e6a6" stroke-width="2"/>
  <circle cx="430" cy="18" r="2.5" fill="#46e6a6"/>

  <g>
    <circle class="particle" cx="384" cy="8" r="1.7" fill="#46e6a6"/>
    <circle class="particle" cx="402" cy="27" r="1.2" fill="#4aa4f7"/>
    <circle class="particle" cx="452" cy="7" r="1.4" fill="#f3a634"/>
    <circle class="particle" cx="474" cy="25" r="1.8" fill="#46e6a6"/>
    <circle class="particle" cx="266" cy="11" r="1.1" fill="#46e6a6"/>
    <circle class="particle" cx="606" cy="27" r="1.3" fill="#4aa4f7"/>
    <circle class="particle" cx="672" cy="9" r="1.2" fill="#f3a634"/>
  </g>
</svg>
