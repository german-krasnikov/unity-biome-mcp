<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Unity Biome MCP</title>
  <desc id="hero-desc">Concept illustration of an AI client sending a live MCP signal through the Unity Biome hub to the Unity Editor.</desc>

  <defs>
    <filter id="hero-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="hero-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .hero-signal {
      animation: hero-flow 4.8s linear infinite;
    }
    .hero-core {
      animation: hero-breathe 3.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hero-orbit {
      animation: hero-orbit 8s linear infinite;
      transform-origin: 320px 118px;
    }
    .hero-spore-a {
      animation: hero-drift-a 6.4s ease-in-out infinite;
    }
    .hero-spore-b {
      animation: hero-drift-b 7.6s ease-in-out infinite;
    }
    .hero-spore-c {
      animation: hero-drift-c 5.8s ease-in-out infinite;
    }
    @keyframes hero-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -48; }
    }
    @keyframes hero-breathe {
      0%, 100% { opacity: 0.68; transform: scale(0.94); }
      48% { opacity: 1; transform: scale(1.07); }
    }
    @keyframes hero-orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes hero-drift-a {
      0%, 100% { transform: translate(0, 0); opacity: 0.25; }
      45% { transform: translate(8px, -5px); opacity: 0.7; }
    }
    @keyframes hero-drift-b {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      55% { transform: translate(-6px, 7px); opacity: 0.62; }
    }
    @keyframes hero-drift-c {
      0%, 100% { transform: translate(0, 0); opacity: 0.18; }
      38% { transform: translate(5px, 6px); opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-signal,
      .hero-core,
      .hero-orbit,
      .hero-spore-a,
      .hero-spore-b,
      .hero-spore-c {
        animation: none !important;
      }
    }
  </style>

  <rect width="640" height="270" fill="#2b2b2b"/>
  <rect x="1" y="1" width="638" height="268" rx="7" fill="none" stroke="#4a4a4a"/>

  <g stroke="#464646" stroke-width="1" opacity="0.42">
    <path d="M0 54H640M0 108H640M0 162H640M0 216H640"/>
    <path d="M80 0V270M160 0V270M240 0V270M320 0V270M400 0V270M480 0V270M560 0V270"/>
  </g>

  <path d="M145 118H262M378 118H495" fill="none" stroke="#5a5a5a" stroke-width="2"/>
  <path class="hero-signal" d="M145 118H262M378 118H495" fill="none" stroke="#46e6a6"
        stroke-width="3" stroke-linecap="round" stroke-dasharray="12 12"
        filter="url(#hero-soft-glow)"/>

  <g>
    <rect x="35" y="74" width="110" height="88" rx="7" fill="#202020" stroke="#707070"/>
    <rect x="49" y="88" width="82" height="45" rx="4" fill="#303030" stroke="#59a7ff"/>
    <circle cx="61" cy="102" r="4" fill="#59a7ff"/>
    <path d="M74 102H117M61 116H117" stroke="#858585" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 147H110" stroke="#707070" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="186" text-anchor="middle" fill="#d0d0d0" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI CLIENT</text>
  </g>

  <g>
    <circle cx="320" cy="118" r="64" fill="#46e6a6" opacity="0.06" filter="url(#hero-glow)"/>
    <circle class="hero-core" cx="320" cy="118" r="49" fill="#46e6a6" opacity="0.16"/>
    <circle cx="320" cy="118" r="43" fill="#242424" stroke="#46e6a6" stroke-width="2"/>
    <circle cx="320" cy="118" r="29" fill="#303030" stroke="#46e6a6"/>
    <path d="M320 96L340 107V129L320 140L300 129V107Z" fill="#46e6a6" opacity="0.92"/>
    <circle cx="320" cy="118" r="6" fill="#eafff7"/>
    <g class="hero-orbit">
      <circle cx="320" cy="59" r="4" fill="#f0a536"/>
      <circle cx="320" cy="177" r="3" fill="#59a7ff"/>
    </g>
    <circle class="hero-spore-a" cx="269" cy="82" r="2.5" fill="#46e6a6"/>
    <circle class="hero-spore-b" cx="369" cy="89" r="2" fill="#f0a536"/>
    <circle class="hero-spore-c" cx="276" cy="158" r="2" fill="#59a7ff"/>
    <text x="320" y="195" text-anchor="middle" fill="#46e6a6" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BIOME HUB</text>
  </g>

  <g>
    <rect x="495" y="70" width="110" height="96" rx="7" fill="#202020" stroke="#707070"/>
    <rect x="509" y="84" width="82" height="54" rx="4" fill="#303030" stroke="#f0a536"/>
    <path d="M550 93L574 106V128L550 137L526 128V106Z" fill="none" stroke="#f0a536" stroke-width="2"/>
    <path d="M550 93V116M526 106L550 116L574 106M550 116V137" fill="none" stroke="#f0a536" stroke-width="2"/>
    <circle cx="522" cy="151" r="4" fill="#46e6a6"/>
    <path d="M534 151H578" stroke="#707070" stroke-width="3" stroke-linecap="round"/>
    <text x="550" y="186" text-anchor="middle" fill="#d0d0d0" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UNITY</text>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="320" y="232" fill="#ededed" font-size="28" font-weight="700">Unity Biome MCP</text>
    <text x="320" y="256" fill="#b5b5b5" font-size="15">Structured AI tools for the Unity Editor</text>
  </g>
</svg>
