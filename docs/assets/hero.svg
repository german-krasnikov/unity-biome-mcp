<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Unity Biome MCP</title>
  <desc id="hero-desc">An AI client and the Unity Editor exchange a living MCP signal through the pulsing Unity Biome core.</desc>

  <defs>
    <linearGradient id="hero-title-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <radialGradient id="hero-core" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#effff9"/>
      <stop offset=".28" stop-color="#46e6a6"/>
      <stop offset="1" stop-color="#46e6a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="hero-green-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="hero-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="hero-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59a7ff"/>
    </marker>
    <marker id="hero-arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#46e6a6"/>
    </marker>
  </defs>

  <style>
    .hero-route {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 12 18;
      animation: hero-flow 3.8s linear infinite;
    }
    .hero-core-aura {
      animation: hero-aura 3.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hero-core-mark {
      animation: hero-core-life 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hero-node {
      animation: hero-node-life 4.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hero-node-right { animation-delay: -2.1s; }
    .hero-spore {
      animation: hero-drift-a 5.2s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    .hero-spore-b { animation-name: hero-drift-b; animation-duration: 6.1s; }
    .hero-spore-c { animation-delay: -2.4s; animation-duration: 4.5s; }
    @keyframes hero-flow { to { stroke-dashoffset: -60; } }
    @keyframes hero-aura {
      0%, 100% { opacity: .14; transform: scale(.82); }
      50% { opacity: .48; transform: scale(1.16); }
    }
    @keyframes hero-core-life {
      0%, 100% { transform: scale(.94) rotate(45deg); }
      50% { transform: scale(1.08) rotate(45deg); }
    }
    @keyframes hero-node-life {
      0%, 100% { opacity: .88; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes hero-drift-a {
      0% { opacity: .16; transform: translate(-8px, 8px) scale(.7); }
      55% { opacity: .86; transform: translate(10px, -10px) scale(1.2); }
      100% { opacity: .28; transform: translate(18px, 4px) scale(.82); }
    }
    @keyframes hero-drift-b {
      0% { opacity: .12; transform: translate(10px, -8px) scale(.76); }
      50% { opacity: .72; transform: translate(-14px, 10px) scale(1.16); }
      100% { opacity: .24; transform: translate(4px, -12px) scale(.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-route, .hero-core-aura, .hero-core-mark, .hero-node, .hero-spore {
        animation: none !important;
      }
      .hero-route { stroke-dasharray: none; opacity: .72; }
      .hero-core-aura { opacity: .26; }
      .hero-core-mark { transform: rotate(45deg); }
      .motion-particle { display: none; }
      .hero-spore { opacity: .3; }
    }
  </style>

  <rect width="1200" height="360" fill="#2b2b2b"/>
  <rect x="1" y="1" width="1198" height="358" rx="8" fill="none" stroke="#4a4a4a"/>
  <g stroke="#777" stroke-width="1" opacity=".1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <g class="hero-node">
    <rect x="80" y="104" width="240" height="102" rx="8" fill="#202020"
          stroke="#59a7ff" stroke-width="2"/>
    <circle cx="118" cy="136" r="7" fill="#59a7ff"/>
    <text x="200" y="160" text-anchor="middle" fill="#f2f2f2" font-size="36"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI CLIENT</text>
  </g>

  <g class="hero-node hero-node-right">
    <rect x="880" y="104" width="240" height="102" rx="8" fill="#202020"
          stroke="#f0a536" stroke-width="2"/>
    <circle cx="918" cy="136" r="7" fill="#f0a536"/>
    <text x="1000" y="144" text-anchor="middle" fill="#f2f2f2" font-size="36"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan
          x="1000">UNITY</tspan><tspan x="1000" dy="38">EDITOR</tspan></text>
  </g>

  <path d="M320 155H530" stroke="#59a7ff" opacity=".28" stroke-width="2"
        marker-end="url(#hero-arrow-blue)"/>
  <path class="hero-route" d="M320 155H530" stroke="#59a7ff"/>
  <path d="M670 155H880" stroke="#46e6a6" opacity=".3" stroke-width="2"
        marker-end="url(#hero-arrow-green)"/>
  <path class="hero-route" d="M670 155H880" stroke="#46e6a6"/>

  <circle class="motion-particle" r="6" fill="#59a7ff">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M320 155H530"/>
  </circle>
  <circle class="motion-particle" r="6" fill="#46e6a6">
    <animateMotion dur="3.1s" begin="-1.4s" repeatCount="indefinite" path="M670 155H880"/>
  </circle>

  <g>
    <circle class="hero-core-aura" cx="600" cy="155" r="94" fill="#46e6a6"
            filter="url(#hero-green-glow)"/>
    <circle cx="600" cy="155" r="62" fill="none" stroke="#46e6a6"
            stroke-width="3" opacity=".72"/>
    <circle cx="600" cy="155" r="43" fill="url(#hero-core)" opacity=".9"/>
    <rect class="hero-core-mark" x="578" y="133" width="44" height="44" rx="6"
          fill="#202020" stroke="#46e6a6" stroke-width="3"/>
    <circle cx="600" cy="155" r="9" fill="#effff9" filter="url(#hero-soft-glow)"/>
  </g>

  <g>
    <circle class="hero-spore" cx="380" cy="70" r="4" fill="#46e6a6"/>
    <circle class="hero-spore hero-spore-b" cx="455" cy="224" r="3" fill="#59a7ff"/>
    <circle class="hero-spore hero-spore-c" cx="750" cy="75" r="4" fill="#46e6a6"/>
    <circle class="hero-spore hero-spore-b" cx="810" cy="230" r="3" fill="#f0a536"/>
    <circle class="hero-spore hero-spore-c" cx="1045" cy="66" r="3" fill="#46e6a6"/>
    <circle class="hero-spore" cx="142" cy="245" r="3" fill="#59a7ff"/>
  </g>

  <text x="600" y="286" text-anchor="middle" fill="url(#hero-title-gradient)"
        font-size="64" font-weight="700" data-mobile-critical="true"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">UNITY BIOME MCP</text>
  <text x="600" y="329" text-anchor="middle" fill="#46e6a6" font-size="36"
        font-weight="600" data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI AND UNITY, ONE LIVING TOOL SURFACE</text>
</svg>
