<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170"
     role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">Unity Biome MCP project inventory</title>
  <desc id="stats-desc"><!-- BIOME:STATS_DESC -->142 registered MCP tools. Test inventory: 10922 entries: 4264 regular Python, 511 Python stress, 289 live Python, and 5858 Unity source attributes. Unity count source: static source scan. Server package version: v1.4.1.<!-- /BIOME:STATS_DESC --></desc>

  <defs>
    <filter id="stats-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="stats-card-a"><rect x="18" y="14" width="292" height="142" rx="7"/></clipPath>
    <clipPath id="stats-card-b"><rect x="334" y="14" width="292" height="142" rx="7"/></clipPath>
    <clipPath id="stats-card-c"><rect x="650" y="14" width="292" height="142" rx="7"/></clipPath>
  </defs>

  <style>
    .stats-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-aura 3.4s ease-in-out infinite;
    }
    .stats-card {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-life 4.6s ease-in-out infinite;
    }
    .stats-card-b { animation-delay: -.9s; }
    .stats-card-c { animation-delay: -1.8s; }
    .stats-scan {
      animation: stats-scan 4.2s ease-in-out infinite;
    }
    .stats-scan-b { animation-delay: -.8s; }
    .stats-scan-c { animation-delay: -1.6s; }
    .stats-spore {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-drift 4.8s ease-in-out infinite alternate;
    }
    .stats-spore-b { animation-delay: -2.2s; animation-duration: 5.7s; }
    @keyframes stats-aura {
      0%, 100% { opacity: .1; transform: scale(.86); }
      50% { opacity: .34; transform: scale(1.12); }
    }
    @keyframes stats-life {
      0%, 100% { opacity: .9; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }
    @keyframes stats-scan {
      0% { transform: translateX(-90px); opacity: 0; }
      18%, 70% { opacity: .75; }
      100% { transform: translateX(390px); opacity: 0; }
    }
    @keyframes stats-drift {
      0% { opacity: .18; transform: translate(-7px, 5px) scale(.72); }
      55% { opacity: .8; transform: translate(8px, -7px) scale(1.18); }
      100% { opacity: .28; transform: translate(15px, 4px) scale(.82); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stats-aura, .stats-card, .stats-scan, .stats-spore {
        animation: none !important;
      }
      .stats-aura { opacity: .18; }
      .stats-scan { display: none; }
      .stats-spore { opacity: .28; }
    }
  </style>

  <rect width="960" height="170" rx="8" fill="#2b2b2b"/>
  <rect x="1" y="1" width="958" height="168" rx="7" fill="none" stroke="#4a4a4a"/>

  <g class="stats-card">
    <rect class="stats-aura" x="18" y="14" width="292" height="142" rx="7"
          fill="#46e6a6" opacity=".12" filter="url(#stats-glow)"/>
    <rect x="18" y="14" width="292" height="142" rx="7" fill="#202020"
          stroke="#46e6a6" stroke-width="2"/>
    <g clip-path="url(#stats-card-a)">
      <rect class="stats-scan" x="-50" y="14" width="70" height="142"
            fill="#46e6a6" opacity=".08"/>
    </g>
    <text x="164" y="79" text-anchor="middle" fill="#f2f2f2" font-size="48"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><!-- BIOME:TOOLS -->142<!-- /BIOME:TOOLS --></text>
    <text x="164" y="116" text-anchor="middle" fill="#46e6a6" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MCP TOOLS</text>
    <rect x="124" y="132" width="80" height="3" rx="1.5" fill="#46e6a6"/>
  </g>

  <g class="stats-card stats-card-b">
    <rect class="stats-aura" x="334" y="14" width="292" height="142" rx="7"
          fill="#59a7ff" opacity=".12" filter="url(#stats-glow)"/>
    <rect x="334" y="14" width="292" height="142" rx="7" fill="#202020"
          stroke="#59a7ff" stroke-width="2"/>
    <g clip-path="url(#stats-card-b)">
      <rect class="stats-scan stats-scan-b" x="266" y="14" width="70" height="142"
            fill="#59a7ff" opacity=".08"/>
    </g>
    <text x="480" y="79" text-anchor="middle" fill="#f2f2f2" font-size="48"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><!-- BIOME:TESTS -->10922<!-- /BIOME:TESTS --></text>
    <text x="480" y="116" text-anchor="middle" fill="#59a7ff" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TEST INVENTORY</text>
    <rect x="440" y="132" width="80" height="3" rx="1.5" fill="#59a7ff"/>
  </g>

  <g class="stats-card stats-card-c">
    <rect class="stats-aura" x="650" y="14" width="292" height="142" rx="7"
          fill="#f0a536" opacity=".12" filter="url(#stats-glow)"/>
    <rect x="650" y="14" width="292" height="142" rx="7" fill="#202020"
          stroke="#f0a536" stroke-width="2"/>
    <g clip-path="url(#stats-card-c)">
      <rect class="stats-scan stats-scan-c" x="582" y="14" width="70" height="142"
            fill="#f0a536" opacity=".08"/>
    </g>
    <text x="796" y="79" text-anchor="middle" fill="#f2f2f2" font-size="48"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><!-- BIOME:VERSION -->v1.4.1<!-- /BIOME:VERSION --></text>
    <text x="796" y="116" text-anchor="middle" fill="#f0a536" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SERVER VERSION</text>
    <rect x="756" y="132" width="80" height="3" rx="1.5" fill="#f0a536"/>
  </g>

  <circle class="stats-spore" cx="320" cy="29" r="3" fill="#46e6a6"/>
  <circle class="stats-spore stats-spore-b" cx="640" cy="143" r="3" fill="#59a7ff"/>
</svg>
