<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 304" width="560" height="304"
     role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">Unity Biome MCP project inventory</title>
  <desc id="stats-desc"><!-- STAT:STATS_DESC -->142 registered MCP tools. Test inventory: 10870 entries: 4252 regular Python, 511 Python stress, 289 live Python, and 5818 Unity source attributes. Unity count source: static source scan.<!-- /STAT --></desc>

  <defs>
    <filter id="stats-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .card { fill: #202020; stroke-width: 1.4; }
    .signal {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 9 14;
      animation: stats-flow 4.2s linear infinite;
    }
    .halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-pulse 2.9s ease-out infinite;
    }
    .core {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-breathe 2.9s ease-in-out infinite;
    }
    .test-halo { animation-delay: -1.35s; }
    .test-core { animation-delay: -1.35s; }
    .particle {
      opacity: .64;
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-drift 4.4s ease-in-out infinite alternate;
    }
    .p2 { animation-delay: -1.1s; animation-duration: 5.2s; }
    .p3 { animation-delay: -2.7s; animation-duration: 3.8s; }
    .p4 { animation-delay: -3.4s; animation-duration: 4.8s; }
    @keyframes stats-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -46; }
    }
    @keyframes stats-pulse {
      0% { opacity: .5; transform: scale(.55); }
      76%, 100% { opacity: 0; transform: scale(1.8); }
    }
    @keyframes stats-breathe {
      0%, 100% { transform: scale(.9); opacity: .78; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes stats-drift {
      0% { transform: translate(-2px, 2px) scale(.75); opacity: .28; }
      50% { transform: translate(5px, -4px) scale(1.12); opacity: .78; }
      100% { transform: translate(8px, 3px) scale(.82); opacity: .4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .halo, .core, .particle { animation: none !important; }
      .signal { stroke-dasharray: none; opacity: .45; }
      .halo { opacity: .2; }
    }
  </style>

  <rect width="560" height="304" fill="#2b2b2b"/>
  <rect x="1" y="1" width="558" height="302" rx="7" fill="none" stroke="#4a4a4a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect class="card" x="12" y="12" width="536" height="130" rx="6" stroke="#46e6a6"/>
      <path d="M44 42H158M402 42H516" stroke="#46e6a6" opacity=".18"/>
      <path class="signal" d="M44 42H158M402 42H516" stroke="#46e6a6"/>
      <circle class="halo" cx="44" cy="42" r="11" fill="none" stroke="#46e6a6"/>
      <circle class="core" cx="44" cy="42" r="6" fill="#46e6a6"/>
      <circle class="particle" cx="82" cy="31" r="2.3" fill="#46e6a6"/>
      <circle class="particle p2" cx="492" cy="50" r="2" fill="#46e6a6"/>
      <text x="280" y="79" text-anchor="middle" fill="#f2f2f2" font-size="42" font-weight="700"><!-- STAT:TOOLS -->142<!-- /STAT --></text>
      <text x="280" y="108" text-anchor="middle" fill="#46e6a6" font-size="16" font-weight="700">REGISTERED MCP TOOLS</text>
      <text x="280" y="128" text-anchor="middle" fill="#a8a8a8" font-size="13">source tool specs</text>
    </g>

    <g>
      <rect class="card" x="12" y="162" width="536" height="130" rx="6" stroke="#59a7ff"/>
      <path d="M44 192H158M402 192H516" stroke="#59a7ff" opacity=".18"/>
      <path class="signal" d="M44 192H158M402 192H516" stroke="#59a7ff"/>
      <circle class="halo test-halo" cx="44" cy="192" r="11" fill="none" stroke="#59a7ff"/>
      <circle class="core test-core" cx="44" cy="192" r="6" fill="#59a7ff"/>
      <circle class="particle p3" cx="91" cy="180" r="2.2" fill="#59a7ff"/>
      <circle class="particle p4" cx="501" cy="202" r="2.4" fill="#59a7ff"/>
      <text x="280" y="222" text-anchor="middle" fill="#f2f2f2" font-size="38" font-weight="700"><!-- STAT:TESTS -->10870<!-- /STAT --></text>
      <text x="280" y="250" text-anchor="middle" fill="#59a7ff" font-size="16" font-weight="700">TEST INVENTORY</text>
      <text x="280" y="271" text-anchor="middle" fill="#b0b0bd" font-size="13"><!-- STAT:BREAKDOWN -->4252 regular · 511 stress · 289 live · 5818 Unity<!-- /STAT --></text>
      <text x="280" y="287" text-anchor="middle" fill="#9b9b9b" font-size="11">Unity source: <!-- STAT:UNITY_SOURCE -->static source scan<!-- /STAT --></text>
    </g>
  </g>
</svg>
