<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" width="640" height="130"
     role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">Unity Biome MCP project inventory</title>
  <desc id="stats-desc"><!-- STAT:STATS_DESC -->142 registered MCP tools. Test inventory: 10922 entries: 4264 regular Python, 511 Python stress, 289 live Python, and 5858 Unity source attributes. Unity count source: static source scan.<!-- /STAT --></desc>
  <metadata id="stats-breakdown"><!-- STAT:BREAKDOWN -->4264 regular · 511 stress · 289 live · 5858 Unity<!-- /STAT --></metadata>
  <metadata id="stats-unity-source"><!-- STAT:UNITY_SOURCE -->static source scan<!-- /STAT --></metadata>

  <defs>
    <filter id="stats-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <style>
    .card { fill: #202020; stroke-width: 1.4; }
    .signal {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 8 13;
      animation: stats-flow 4.2s linear infinite;
    }
    .halo {
      animation: stats-pulse 2.8s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .core {
      animation: stats-breathe 2.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .particle {
      animation: stats-drift 4.1s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    .delay { animation-delay: -1.4s; }
    .slow { animation-duration: 5.2s; animation-delay: -2.3s; }
    @keyframes stats-flow { to { stroke-dashoffset: -42; } }
    @keyframes stats-pulse {
      0% { opacity: .48; transform: scale(.55); }
      78%, 100% { opacity: 0; transform: scale(1.85); }
    }
    @keyframes stats-breathe {
      0%, 100% { opacity: .78; transform: scale(.88); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes stats-drift {
      0% { opacity: .22; transform: translate(-3px, 2px) scale(.72); }
      48% { opacity: .82; transform: translate(5px, -4px) scale(1.18); }
      100% { opacity: .34; transform: translate(8px, 3px) scale(.84); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .halo, .core, .particle { animation: none !important; }
      .signal { stroke-dasharray: none; opacity: .45; }
      .halo { opacity: .18; }
      .particle { opacity: .35; }
    }
  </style>

  <rect width="640" height="130" fill="#2b2b2b"/>
  <rect x="1" y="1" width="638" height="128" rx="7" fill="none" stroke="#4a4a4a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect class="card" x="12" y="12" width="300" height="106" rx="6" stroke="#46e6a6"/>
      <path d="M30 34H100M224 34H294" stroke="#46e6a6" opacity=".18"/>
      <path class="signal" d="M30 34H100M224 34H294" stroke="#46e6a6"/>
      <circle class="halo" cx="30" cy="34" r="9" fill="none" stroke="#46e6a6"/>
      <circle class="core" cx="30" cy="34" r="5" fill="#46e6a6"/>
      <circle class="particle" cx="74" cy="25" r="2" fill="#46e6a6"/>
      <circle class="particle slow" cx="275" cy="43" r="1.8" fill="#46e6a6"/>
      <text x="162" y="70" text-anchor="middle" fill="#f2f2f2" font-size="36"
            font-weight="700" data-mobile-critical="true"><!-- STAT:TOOLS -->142<!-- /STAT --></text>
      <text x="162" y="101" text-anchor="middle" fill="#46e6a6" font-size="20"
            font-weight="700" data-mobile-critical="true">MCP TOOLS</text>
    </g>

    <g>
      <rect class="card" x="328" y="12" width="300" height="106" rx="6" stroke="#59a7ff"/>
      <path d="M346 34H416M540 34H610" stroke="#59a7ff" opacity=".18"/>
      <path class="signal" d="M346 34H416M540 34H610" stroke="#59a7ff"/>
      <circle class="halo delay" cx="346" cy="34" r="9" fill="none" stroke="#59a7ff"/>
      <circle class="core delay" cx="346" cy="34" r="5" fill="#59a7ff"/>
      <circle class="particle delay" cx="388" cy="24" r="2" fill="#59a7ff"/>
      <circle class="particle slow" cx="590" cy="43" r="2" fill="#59a7ff"/>
      <text x="478" y="70" text-anchor="middle" fill="#f2f2f2" font-size="34"
            font-weight="700" data-mobile-critical="true"><!-- STAT:TESTS -->10922<!-- /STAT --></text>
      <text x="478" y="101" text-anchor="middle" fill="#59a7ff" font-size="20"
            font-weight="700" data-mobile-critical="true">TEST INVENTORY</text>
    </g>
  </g>
</svg>
