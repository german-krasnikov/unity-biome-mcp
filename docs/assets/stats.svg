<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380"
     role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">Unity Biome MCP project inventory</title>
  <desc id="stats-desc" data-biome-marker="STATS_DESC"><!-- BIOME:STATS_DESC -->148 registered MCP tools. Test inventory: 12117 entries: 4840 regular Python, 511 Python stress, 334 live Python, and 6432 Unity source attributes. Unity count source: static source scan. Server package version: v1.27.0.<!-- /BIOME:STATS_DESC --></desc>

  <defs>
    <filter id="stats-core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="stats-tools-clip">
      <rect x="12" y="12" width="536" height="130" rx="7"/>
    </clipPath>
    <clipPath id="stats-tests-clip">
      <rect x="12" y="162" width="536" height="130" rx="7"/>
    </clipPath>
    <linearGradient id="stats-tools-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46e6a6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#46e6a6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#46e6a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stats-tests-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59a7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#59a7ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#59a7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .stats-card {
      fill: #202020;
      stroke-width: 1.5;
    }
    .stats-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-aura-breathe 4.2s ease-in-out infinite;
    }
    .stats-aura-tests { animation-delay: -2.1s; }
    .stats-flow {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 7 13;
      animation: stats-flow 3.8s linear infinite;
    }
    .stats-flow-tests {
      animation-delay: -1.9s;
      animation-duration: 4.4s;
    }
    .stats-ring {
      fill: none;
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-ring-life 3.2s ease-out infinite;
    }
    .stats-ring-mid { animation-delay: -1.05s; }
    .stats-ring-late { animation-delay: -2.1s; }
    .stats-ring-tests { animation-duration: 3.7s; }
    .stats-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-core-life 2.8s ease-in-out infinite;
    }
    .stats-core-tests {
      animation-delay: -1.4s;
      animation-duration: 3.2s;
    }
    .stats-scan {
      animation: stats-scan-yoyo 5.4s ease-in-out infinite alternate;
    }
    .stats-scan-tests {
      animation-delay: -2.7s;
      animation-duration: 6.2s;
    }
    .stats-spore {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-spore-drift 5.1s ease-in-out infinite alternate;
    }
    .stats-spore-b { animation-delay: -1.7s; animation-duration: 6.3s; }
    .stats-spore-c { animation-delay: -3.4s; animation-duration: 4.7s; }
    .stats-spore-phase-1 { animation-delay: -.6s; animation-duration: 5.5s; }
    .stats-spore-phase-2 { animation-delay: -1.3s; animation-duration: 4.8s; }
    .stats-spore-phase-3 { animation-delay: -2.2s; animation-duration: 6s; }
    .stats-spore-phase-4 { animation-delay: -3.1s; animation-duration: 5.2s; }
    .stats-spore-phase-5 { animation-delay: -4s; animation-duration: 6.6s; }
    .stats-spore-phase-6 { animation-delay: -4.8s; animation-duration: 5.8s; }
    .stats-bridge {
      transform-box: fill-box;
      transform-origin: center;
      animation: stats-bridge-life 3.6s ease-in-out infinite;
    }
    .motion-particle { pointer-events: none; }
    @keyframes stats-aura-breathe {
      0%, 100% { opacity: .07; transform: scale(.985); }
      50% { opacity: .2; transform: scale(1.015); }
    }
    @keyframes stats-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -40; }
    }
    @keyframes stats-ring-life {
      0% { opacity: .7; transform: scale(.45); }
      72%, 100% { opacity: 0; transform: scale(1.85); }
    }
    @keyframes stats-core-life {
      0%, 100% { opacity: .8; transform: scale(.86); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes stats-scan-yoyo {
      0% { opacity: 0; transform: translateX(-76px); }
      16%, 84% { opacity: .8; }
      100% { opacity: 0; transform: translateX(596px); }
    }
    @keyframes stats-spore-drift {
      0% { opacity: .2; transform: translate(-5px, 4px) scale(.72); }
      48% { opacity: .72; transform: translate(4px, -5px) scale(1.12); }
      100% { opacity: .3; transform: translate(9px, 3px) scale(.84); }
    }
    @keyframes stats-bridge-life {
      0%, 100% { opacity: .38; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stats-aura, .stats-flow, .stats-ring, .stats-core,
      .stats-scan, .stats-spore, .stats-bridge {
        animation: none !important;
      }
      .stats-aura { opacity: .1; }
      .stats-flow { stroke-dasharray: none; opacity: .42; }
      .stats-ring { opacity: .18; }
      .stats-core { opacity: 1; }
      .stats-scan, .motion-particle { display: none; }
      .stats-spore { opacity: .3; }
      .stats-bridge { opacity: .75; }
    }
  </style>

  <rect width="560" height="380" rx="8" fill="#2b2b2b"/>
  <rect x="1" y="1" width="558" height="378" rx="7" fill="none" stroke="#4a4a4a"/>

  <path d="M280 142V162" stroke="#46e6a6" stroke-width="1.5" opacity=".22"/>
  <circle class="stats-bridge" cx="280" cy="152" r="4" fill="#46e6a6"
          filter="url(#stats-core-glow)"/>
  <circle class="stats-spore stats-spore-b stats-spore-phase-1" cx="264" cy="151" r="2.2" fill="#59a7ff"/>
  <circle class="stats-spore stats-spore-c stats-spore-phase-2" cx="298" cy="153" r="1.8" fill="#f0a536"/>

  <rect class="stats-aura" x="12" y="12" width="536" height="130" rx="7"
        fill="#46e6a6"/>
  <rect class="stats-card" x="12" y="12" width="536" height="130" rx="7"
        stroke="#46e6a6"/>
  <g clip-path="url(#stats-tools-clip)">
    <rect class="stats-scan" x="-70" y="12" width="74" height="130"
          fill="url(#stats-tools-scan)"/>
  </g>
  <path d="M42 43H171M389 43H518" stroke="#46e6a6" opacity=".16"/>
  <path class="stats-flow" d="M42 43H171M389 43H518" stroke="#46e6a6"/>

  <g aria-hidden="true">
    <circle class="stats-ring" cx="42" cy="43" r="10" stroke="#46e6a6" stroke-width="1.4"/>
    <circle class="stats-ring stats-ring-mid" cx="42" cy="43" r="10"
            stroke="#46e6a6" stroke-width="1.2"/>
    <circle class="stats-ring stats-ring-late" cx="518" cy="43" r="10"
            stroke="#46e6a6" stroke-width="1.2"/>
    <circle class="stats-core" cx="42" cy="43" r="5.5" fill="#46e6a6"
            filter="url(#stats-core-glow)"/>
    <circle class="stats-core" cx="518" cy="43" r="4.5" fill="#46e6a6"/>
    <circle class="stats-spore" cx="87" cy="29" r="2.4" fill="#46e6a6"/>
    <circle class="stats-spore stats-spore-b stats-spore-phase-3" cx="133" cy="56" r="1.8" fill="#f0a536"/>
    <circle class="stats-spore stats-spore-c stats-spore-phase-4" cx="477" cy="28" r="2.2" fill="#46e6a6"/>
    <g class="motion-particle">
      <circle r="2.4" fill="#46e6a6">
        <animateMotion dur="4.8s" begin="-1.3s" repeatCount="indefinite"
                       path="M42 43H171"/>
        <animate attributeName="opacity" values="0;.9;.9;0" dur="4.8s"
                 begin="-1.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g class="motion-particle">
      <circle r="2" fill="#46e6a6">
        <animateMotion dur="5.6s" begin="-4.1s" repeatCount="indefinite"
                       path="M389 43H518"/>
        <animate attributeName="opacity" values="0;.75;.75;0" dur="5.6s"
                 begin="-4.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="280" y="82" text-anchor="middle" fill="#f2f2f2" font-size="42"
          data-biome-marker="TOOLS"
          font-weight="700" data-mobile-critical="true"><!-- BIOME:TOOLS -->148<!-- /BIOME:TOOLS --></text>
    <text x="280" y="116" text-anchor="middle" fill="#46e6a6" font-size="17"
          font-weight="700" data-mobile-critical="true">REGISTERED MCP TOOLS</text>
  </g>

  <rect class="stats-aura stats-aura-tests" x="12" y="162" width="536" height="130"
        rx="7" fill="#59a7ff"/>
  <rect class="stats-card stats-card-tests" x="12" y="162" width="536" height="130"
        rx="7" stroke="#59a7ff"/>
  <g clip-path="url(#stats-tests-clip)">
    <rect class="stats-scan stats-scan-tests" x="-70" y="162" width="74" height="130"
          fill="url(#stats-tests-scan)"/>
  </g>
  <path d="M42 193H171M389 193H518" stroke="#59a7ff" opacity=".16"/>
  <path class="stats-flow stats-flow-tests" d="M42 193H171M389 193H518"
        stroke="#59a7ff"/>

  <g aria-hidden="true">
    <circle class="stats-ring stats-ring-tests" cx="42" cy="193" r="10"
            stroke="#59a7ff" stroke-width="1.4"/>
    <circle class="stats-ring stats-ring-mid stats-ring-tests" cx="518" cy="193" r="10"
            stroke="#59a7ff" stroke-width="1.2"/>
    <circle class="stats-core stats-core-tests" cx="42" cy="193" r="5.5"
            fill="#59a7ff" filter="url(#stats-core-glow)"/>
    <circle class="stats-core stats-core-tests" cx="518" cy="193" r="4.5" fill="#59a7ff"/>
    <circle class="stats-spore stats-spore-c stats-spore-phase-5" cx="78" cy="178" r="2.1" fill="#59a7ff"/>
    <circle class="stats-spore stats-spore-phase-6" cx="118" cy="208" r="1.8" fill="#46e6a6"/>
    <circle class="stats-spore stats-spore-b stats-spore-phase-2" cx="485" cy="178" r="2.4" fill="#59a7ff"/>
    <g class="motion-particle">
      <circle r="2.4" fill="#59a7ff">
        <animateMotion dur="5.2s" begin="-3.7s" repeatCount="indefinite"
                       path="M42 193H171"/>
        <animate attributeName="opacity" values="0;.9;.9;0" dur="5.2s"
                 begin="-3.7s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g class="motion-particle">
      <circle r="2" fill="#59a7ff">
        <animateMotion dur="4.6s" begin="-.8s" repeatCount="indefinite"
                       path="M389 193H518"/>
        <animate attributeName="opacity" values="0;.75;.75;0" dur="4.6s"
                 begin="-.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="280" y="218" text-anchor="middle" fill="#f2f2f2" font-size="38"
          data-biome-marker="TESTS"
          font-weight="700" data-mobile-critical="true"><!-- BIOME:TESTS -->12117<!-- /BIOME:TESTS --></text>
    <text x="280" y="245" text-anchor="middle" fill="#59a7ff" font-size="17"
          font-weight="700" data-mobile-critical="true">TEST INVENTORY</text>
    <text x="280" y="266" text-anchor="middle" fill="#d2d2d2" font-size="17"
          data-biome-marker="BREAKDOWN_PRIMARY"
          data-mobile-critical="true"><!-- BIOME:BREAKDOWN_PRIMARY -->4840 regular / 511 stress<!-- /BIOME:BREAKDOWN_PRIMARY --></text>
    <text x="280" y="283" text-anchor="middle" fill="#b7b7bd" font-size="17"
          data-biome-marker="BREAKDOWN_SECONDARY"
          data-mobile-critical="true"><!-- BIOME:BREAKDOWN_SECONDARY -->334 live / 6432 Unity<!-- /BIOME:BREAKDOWN_SECONDARY --></text>
  </g>

  <!-- second bridge -->
  <path d="M280 292V306" stroke="#59a7ff" stroke-width="1.5" opacity=".15"/>

  <!-- pyramid section -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="280" y="316" text-anchor="middle" fill="#888" font-size="11"
          font-weight="600" letter-spacing="1.5">TEST PYRAMID</text>

    <rect data-biome-bar="CS"
          x="82" y="322" height="7" width="396" rx="3" fill="#59a7ff" opacity=".85"/>
    <text data-biome-bar-label="CS"
          x="478" y="331" text-anchor="end" fill="#b7b7bd" font-size="10">6432 c#</text>

    <rect data-biome-bar="PY"
          x="82" y="337" height="7" width="298" rx="3" fill="#46e6a6" opacity=".85"/>
    <text data-biome-bar-label="PY"
          x="478" y="346" text-anchor="end" fill="#b7b7bd" font-size="10">4840 py</text>

    <rect data-biome-bar="STRESS"
          x="82" y="352" height="7" width="31" rx="3" fill="#f0a536" opacity=".85"/>
    <text data-biome-bar-label="STRESS"
          x="478" y="361" text-anchor="end" fill="#b7b7bd" font-size="10">511 stress</text>

    <rect data-biome-bar="LIVE"
          x="82" y="367" height="7" width="21" rx="3" fill="#e67e46" opacity=".85"/>
    <text data-biome-bar-label="LIVE"
          x="478" y="376" text-anchor="end" fill="#b7b7bd" font-size="10">334 live</text>
  </g>
</svg>
