  <path class="route-life" d="M148 111H174M302 111H328" stroke="#59a7ff"/>
  <path class="route-life" d="M456 111H482" stroke="#46e6a6"/>
  <path class="route-life route-life-return" d="M148 122H174M302 122H328M456 122H482"
        stroke="#46e6a6"/>

  <g class="node">
    <rect class="node-shell" x="20" y="68" width="128" height="92" rx="6" stroke="#59a7ff"/>
