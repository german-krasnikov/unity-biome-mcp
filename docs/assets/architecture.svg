    <circle r="2.4" fill="#f0a536" filter="url(#architecture-glow)"/>
    <animateMotion dur="5.8s" begin="-3.8s" repeatCount="indefinite"
                   path="M456 111Q469 103 482 111L482 122Q469 130 456 122Z"/>
  </g>

  <path d="M20 190H620" stroke="#444" stroke-width="1"/>
  <g>
    <circle class="biome-aura" cx="320" cy="190" r="28"
            filter="url(#architecture-glow)"/>
    <rect class="biome-core" x="311" y="181" width="18" height="18" rx="3"
          fill="#202020" stroke="url(#architecture-biome-core)" stroke-width="2"/>
    <circle cx="320" cy="190" r="3.5" fill="#effff9"/>
  </g>
  <circle class="spore" cx="278" cy="185" r="2.4" fill="#46e6a6"/>
  <circle class="spore spore-b" cx="351" cy="178" r="2" fill="#59a7ff"/>
  <circle class="spore spore-c" cx="365" cy="202" r="2.2" fill="#f0a536"/>

  <text x="20" y="226" fill="#f0a536" font-size="20" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN-UNITY CHAT PATH</text>
  <text x="620" y="226" text-anchor="end" fill="#a8a8a8" font-size="19"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SHARED UNITY SURFACE</text>

  <path class="route-base" d="M148 304H174M302 304H328M456 304H482"
        stroke="#f0a536" marker-start="url(#architecture-arrow-orange)"
        marker-end="url(#architecture-arrow-orange)"/>
  <path class="route-life" d="M148 304H174M302 304H328" stroke="#f0a536"/>
  <path class="route-life" d="M456 304H482" stroke="#46e6a6"/>
  <path class="route-life route-life-return" d="M148 315H174M302 315H328M456 315H482"
        stroke="#46e6a6"/>
  <path class="route-base" d="M620 304H630V190H410Q392 190 392 172V160"
        stroke="#46e6a6" marker-start="url(#architecture-arrow-green)"
        marker-end="url(#architecture-arrow-green)"/>
  <path class="route-life" d="M620 304H630V190H410Q392 190 392 172V160"
        stroke="#46e6a6"/>
  <path class="route-life route-life-return" d="M620 315H636V184H416Q401 184 401 169V160"
        stroke="#59a7ff"/>

  <g class="node node-c node-phase-5">
    <rect class="node-shell" x="20" y="258" width="128" height="92" rx="6" stroke="#f0a536"/>
    <rect class="node-scan node-scan-c" x="30" y="266" width="8" height="76" rx="4" fill="#f0a536"/>
    <circle cx="38" cy="274" r="4" fill="#f0a536"/>
    <text x="84" y="301" text-anchor="middle" fill="#f0a536" font-size="20"
