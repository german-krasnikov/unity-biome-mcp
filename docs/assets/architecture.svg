<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458"
     role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Unity Biome MCP architecture</title>
  <desc id="architecture-desc">Two deterministic animated local routes share one Unity tool surface. An external MCP client launches the Python MCP server over standard input and output, which exchanges framed commands with the Unity Editor plugin through a localhost TCP bridge. In-Unity Chat passes turns through its local Chat Relay and selected CLI backend into a Python MCP connection, then joins the same TCP bridge and Unity plugin path.</desc>

  <defs>
    <linearGradient id="architecture-biome-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73f8c1"/>
      <stop offset=".55" stop-color="#46e6a6"/>
      <stop offset="1" stop-color="#59a7ff"/>
    </linearGradient>
    <filter id="architecture-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <marker id="architecture-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#59a7ff"/>
    </marker>
    <marker id="architecture-arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#46e6a6"/>
    </marker>
    <marker id="architecture-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f0a536"/>
    </marker>
  </defs>

  <style>
    .route-base {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: .32;
    }
    .route-life {
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 7 13;
      animation: architecture-flow 3.6s linear infinite;
    }
    .route-life-return {
      stroke-dasharray: 3 17;
      animation-direction: reverse;
      animation-duration: 4.8s;
    }
    .node {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-node-breathe 4.8s ease-in-out infinite;
    }
    .node-b { animation-delay: -.8s; }
    .node-c { animation-delay: -1.6s; }
    .node-d { animation-delay: -2.4s; }
    .node-e { animation-delay: -3.2s; }
    .node-phase-5 { animation-delay: -.45s; }
    .node-phase-6 { animation-delay: -1.25s; }
    .node-phase-7 { animation-delay: -2.05s; }
    .node-phase-8 { animation-delay: -2.85s; }
    .node-shell {
      fill: #202020;
      stroke-width: 1.5;
    }
    .node-scan {
      opacity: .16;
    }
    .biome-aura {
      fill: #46e6a6;
      opacity: .16;
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-aura 3.4s ease-in-out infinite;
    }
    .biome-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-core 3.4s ease-in-out infinite;
    }
    .spore {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-spore-a 5.2s ease-in-out infinite alternate;
    }
    .spore-b {
      animation-name: architecture-spore-b;
      animation-duration: 6.1s;
      animation-delay: -2.2s;
    }
    .spore-c {
      animation-name: architecture-spore-c;
      animation-duration: 4.6s;
      animation-delay: -3.4s;
    }
    .spore-phase-4 { animation-delay: -.7s; animation-duration: 5.7s; }
    .spore-phase-5 { animation-delay: -1.5s; animation-duration: 4.9s; }
    .spore-phase-6 { animation-delay: -2.9s; animation-duration: 5.5s; }
    .spore-phase-7 { animation-delay: -4.1s; animation-duration: 6.4s; }
    @keyframes architecture-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -40; }
    }
    @keyframes architecture-node-breathe {
      0%, 100% { opacity: .9; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1.5px); }
    }
    @keyframes architecture-aura {
      0%, 100% { opacity: .1; transform: scale(.78); }
      50% { opacity: .34; transform: scale(1.18); }
    }
    @keyframes architecture-core {
      0%, 100% { opacity: .9; transform: rotate(45deg) scale(.92); }
      50% { opacity: 1; transform: rotate(45deg) scale(1.08); }
    }
    @keyframes architecture-spore-a {
      0% { opacity: .14; transform: translate(-3px, 5px) scale(.72); }
      52% { opacity: .75; transform: translate(8px, -7px) scale(1.16); }
      100% { opacity: .24; transform: translate(14px, 2px) scale(.82); }
    }
    @keyframes architecture-spore-b {
      0% { opacity: .12; transform: translate(7px, -4px) scale(.76); }
      50% { opacity: .68; transform: translate(-10px, 8px) scale(1.12); }
      100% { opacity: .22; transform: translate(3px, -9px) scale(.8); }
    }
    @keyframes architecture-spore-c {
      0% { opacity: .18; transform: translate(-6px, -3px) scale(.8); }
      55% { opacity: .8; transform: translate(9px, 6px) scale(1.2); }
      100% { opacity: .2; transform: translate(-2px, 10px) scale(.74); }
    }
    @media (prefers-reduced-motion: reduce) {
      .route-life, .node, .biome-aura, .biome-core, .spore {
        animation: none !important;
      }
      .route-life { stroke-dasharray: none; opacity: .68; }
      .node { opacity: 1; }
      .node-scan { opacity: .1; }
      .biome-aura { opacity: .18; }
      .biome-core { transform: rotate(45deg); }
      .spore { opacity: .3; }
      .motion-particle { display: none; }
    }
  </style>

  <rect width="640" height="458" rx="8" fill="#2b2b2b"/>
  <rect x="1" y="1" width="638" height="456" rx="7" fill="none" stroke="#4a4a4a"/>
  <g stroke="#777" stroke-width="1" opacity=".055">
    <path d="M0 54H640M0 190H640M0 238H640M0 374H640M0 422H640"/>
    <path d="M80 0V458M160 0V458M240 0V458M320 0V458M400 0V458M480 0V458M560 0V458"/>
  </g>

  <text x="20" y="34" fill="#59a7ff" font-size="20" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EXTERNAL MCP PATH</text>
  <text x="620" y="34" text-anchor="end" fill="#a8a8a8" font-size="19"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STDIO / LOCALHOST TCP</text>

  <path class="route-base" d="M148 111H174M302 111H328M456 111H482"
