<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340"
     role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Unity Biome MCP architecture</title>
  <desc id="architecture-desc">Two animated local workflows: an external MCP client reaches the Unity plugin through a Python MCP server and TCP bridge; In-Unity Chat passes through its relay and CLI backend before a Python MCP server rejoins the shared TCP bridge and Unity plugin path.</desc>

  <defs>
    <filter id="architecture-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="architecture-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <style>
    .architecture-lane {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 12 16;
      animation: architecture-flow 3.4s linear infinite;
    }
    .architecture-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-breathe 4.8s ease-in-out infinite;
    }
    .architecture-node-b { animation-delay: -.8s; }
    .architecture-node-c { animation-delay: -1.6s; }
    .architecture-node-d { animation-delay: -2.4s; }
    .architecture-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-aura 3.2s ease-in-out infinite;
    }
    .architecture-spore {
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-drift-a 4.9s ease-in-out infinite alternate;
    }
    .architecture-spore-b {
      animation-name: architecture-drift-b;
      animation-duration: 5.8s;
      animation-delay: -2.1s;
    }
    @keyframes architecture-flow { to { stroke-dashoffset: -56; } }
    @keyframes architecture-breathe {
      0%, 100% { opacity: .88; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }
    @keyframes architecture-aura {
      0%, 100% { opacity: .12; transform: scale(.84); }
      50% { opacity: .4; transform: scale(1.14); }
    }
    @keyframes architecture-drift-a {
      0% { opacity: .18; transform: translate(-7px, 5px) scale(.72); }
      55% { opacity: .8; transform: translate(8px, -7px) scale(1.18); }
      100% { opacity: .28; transform: translate(15px, 4px) scale(.82); }
    }
    @keyframes architecture-drift-b {
      0% { opacity: .14; transform: translate(8px, -5px) scale(.75); }
      50% { opacity: .7; transform: translate(-11px, 8px) scale(1.12); }
      100% { opacity: .24; transform: translate(4px, -10px) scale(.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .architecture-lane, .architecture-node, .architecture-aura, .architecture-spore {
        animation: none !important;
      }
      .architecture-lane { stroke-dasharray: none; opacity: .65; }
      .architecture-aura { opacity: .2; }
      .architecture-spore { opacity: .28; }
      .motion-particle { display: none; }
    }
  </style>

  <rect width="960" height="340" rx="8" fill="#2b2b2b"/>
  <rect x="1" y="1" width="958" height="338" rx="7" fill="none" stroke="#4a4a4a"/>
  <g stroke="#777" stroke-width="1" opacity=".08">
    <path d="M0 68H960M0 170H960M0 272H960"/>
    <path d="M120 0V340M240 0V340M360 0V340M480 0V340M600 0V340M720 0V340M840 0V340"/>
  </g>

  <text x="480" y="48" text-anchor="middle" fill="#f2f2f2" font-size="34"
        font-weight="700" data-mobile-critical="true"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">TWO LOCAL PATHS. ONE UNITY TOOL SURFACE.</text>

  <text x="20" y="90" fill="#59a7ff" font-size="28" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EXTERNAL MCP</text>
  <text x="20" y="222" fill="#f0a536" font-size="28" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN-UNITY CHAT</text>

  <path d="M200 139H260M440 139H500M680 139H760" stroke="#59a7ff"
        stroke-width="2" opacity=".24"/>
  <path class="architecture-lane" d="M200 139H260M440 139H500M680 139H760"
        stroke="#59a7ff"/>
  <path d="M200 271H260M440 271H500M680 271H760" stroke="#f0a536"
        stroke-width="2" opacity=".24"/>
  <path class="architecture-lane" d="M200 271H260M440 271H500M680 271H760"
        stroke="#f0a536"/>
  <path d="M850 232C850 199 690 195 590 178" fill="none" stroke="#46e6a6"
        stroke-width="2" opacity=".24"/>
  <path class="architecture-lane" d="M850 232C850 199 690 195 590 178"
        stroke="#46e6a6"/>

  <g class="architecture-node">
    <rect x="20" y="100" width="180" height="78" rx="7" fill="#202020"
          stroke="#59a7ff" stroke-width="2"/>
    <circle cx="43" cy="120" r="5" fill="#59a7ff"/>
    <text x="110" y="148" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MCP CLIENT</text>
  </g>
  <g class="architecture-node architecture-node-b">
    <rect x="260" y="100" width="180" height="78" rx="7" fill="#202020"
          stroke="#46e6a6" stroke-width="2"/>
    <text x="350" y="148" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PYTHON MCP</text>
  </g>
  <g class="architecture-node architecture-node-c">
    <rect x="500" y="100" width="180" height="78" rx="7" fill="#202020"
          stroke="#46e6a6" stroke-width="2"/>
    <text x="590" y="148" text-anchor="middle" fill="#46e6a6" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TCP BRIDGE</text>
  </g>
  <g class="architecture-node architecture-node-d">
    <rect x="760" y="100" width="180" height="78" rx="7" fill="#202020"
          stroke="#f0a536" stroke-width="2"/>
    <text x="850" y="130" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan
          x="850">UNITY</tspan><tspan x="850" dy="30">PLUGIN</tspan></text>
  </g>

  <g class="architecture-node architecture-node-c">
    <rect x="20" y="232" width="180" height="78" rx="7" fill="#202020"
          stroke="#f0a536" stroke-width="2"/>
    <circle cx="43" cy="252" r="5" fill="#f0a536"/>
    <text x="110" y="280" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CHAT UI</text>
  </g>
  <g class="architecture-node architecture-node-d">
    <rect x="260" y="232" width="180" height="78" rx="7" fill="#202020"
          stroke="#46e6a6" stroke-width="2"/>
    <text x="350" y="280" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CHAT RELAY</text>
  </g>
  <g class="architecture-node architecture-node-b">
    <rect x="500" y="232" width="180" height="78" rx="7" fill="#202020"
          stroke="#59a7ff" stroke-width="2"/>
    <text x="590" y="261" text-anchor="middle" fill="#f2f2f2" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan
          x="590">CLI</tspan><tspan x="590" dy="30">BACKEND</tspan></text>
  </g>
  <g class="architecture-node">
    <rect x="760" y="232" width="180" height="78" rx="7" fill="#202020"
          stroke="#46e6a6" stroke-width="2"/>
    <text x="850" y="261" text-anchor="middle" fill="#46e6a6" font-size="28"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan
          x="850">PYTHON</tspan><tspan x="850" dy="30">MCP</tspan></text>
  </g>

  <circle class="motion-particle" r="5" fill="#59a7ff" filter="url(#architecture-soft-glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M200 139H260"/>
  </circle>
  <circle class="motion-particle" r="4" fill="#46e6a6" filter="url(#architecture-soft-glow)">
    <animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite" path="M440 139H500"/>
  </circle>
  <circle class="motion-particle" r="5" fill="#46e6a6" filter="url(#architecture-soft-glow)">
    <animateMotion dur="2.5s" begin="-1.6s" repeatCount="indefinite" path="M680 139H760"/>
  </circle>
  <circle class="motion-particle" r="5" fill="#f0a536" filter="url(#architecture-soft-glow)">
    <animateMotion dur="2.7s" begin="-.4s" repeatCount="indefinite" path="M200 271H260"/>
  </circle>
  <circle class="motion-particle" r="4" fill="#46e6a6" filter="url(#architecture-soft-glow)">
    <animateMotion dur="3.1s" begin="-1.3s" repeatCount="indefinite" path="M440 271H500"/>
  </circle>
  <circle class="motion-particle" r="5" fill="#46e6a6" filter="url(#architecture-soft-glow)">
    <animateMotion dur="2.6s" begin="-2s" repeatCount="indefinite" path="M680 271H760"/>
  </circle>
  <circle class="motion-particle" r="4" fill="#46e6a6" filter="url(#architecture-soft-glow)">
    <animateMotion dur="3.3s" begin="-1.1s" repeatCount="indefinite"
                   path="M850 232C850 199 690 195 590 178"/>
  </circle>

  <g>
    <circle class="architecture-aura" cx="729" cy="190" r="33" fill="#46e6a6"
            filter="url(#architecture-glow)"/>
    <rect x="719" y="180" width="20" height="20" rx="3" fill="#202020"
          stroke="#46e6a6" stroke-width="2" transform="rotate(45 729 190)"/>
    <circle cx="729" cy="190" r="4" fill="#effff9"/>
  </g>
  <circle class="architecture-spore" cx="216" cy="199" r="3" fill="#46e6a6"/>
  <circle class="architecture-spore architecture-spore-b" cx="470" cy="80" r="3" fill="#59a7ff"/>
  <circle class="architecture-spore" cx="716" cy="317" r="3" fill="#f0a536"/>
</svg>
