<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"
     role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Unity Biome MCP architecture</title>
  <desc id="architecture-desc">External MCP clients launch the Python MCP server over standard input and output. The server exchanges framed commands with the Unity Editor plugin over localhost TCP. In-Unity Chat reaches the same server and Unity tool surface through its local relay and selected CLI backend.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#46e6a6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#59a7ff"/>
    </marker>
    <filter id="architecture-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .node { fill: #202020; stroke-width: 1.6; }
    .title {
      fill: #f0f0f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
      text-anchor: middle;
    }
    .protocol {
      fill: #a8a8a8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 600;
      text-anchor: middle;
    }
    .route { fill: none; stroke-width: 1.5; opacity: .38; }
    .flow {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 12;
      animation: architecture-flow 3.7s linear infinite;
    }
    .server-aura {
      animation: architecture-aura 3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .server-node {
      animation: architecture-life 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .spore {
      animation: architecture-drift-a 4.4s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    .spore:nth-of-type(2n) { animation-name: architecture-drift-b; animation-duration: 5.3s; }
    .spore:nth-of-type(3n) { animation-duration: 3.8s; animation-delay: -2s; }
    @keyframes architecture-flow { to { stroke-dashoffset: -40; } }
    @keyframes architecture-aura {
      0%, 100% { opacity: .1; transform: scale(.88); }
      50% { opacity: .34; transform: scale(1.13); }
    }
    @keyframes architecture-life {
      0%, 100% { transform: translateY(0); }
      46% { transform: translateY(-2px); }
    }
    @keyframes architecture-drift-a {
      0% { opacity: .18; transform: translate(-3px, 3px) scale(.7); }
      55% { opacity: .82; transform: translate(5px, -4px) scale(1.2); }
      100% { opacity: .3; transform: translate(8px, 2px) scale(.82); }
    }
    @keyframes architecture-drift-b {
      0% { opacity: .16; transform: translate(4px, -3px) scale(.76); }
      48% { opacity: .7; transform: translate(-6px, 4px) scale(1.14); }
      100% { opacity: .25; transform: translate(2px, -5px) scale(.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .server-aura, .server-node, .spore { animation: none !important; }
      .flow { stroke-dasharray: none; opacity: .7; }
      .server-aura { opacity: .18; }
      .motion-particle { display: none; }
      .spore { opacity: .3; }
    }
  </style>

  <rect width="640" height="210" fill="#2b2b2b"/>
  <rect x="1" y="1" width="638" height="208" rx="7" fill="none" stroke="#4a4a4a"/>
  <g stroke="#464646" stroke-width="1" opacity=".22">
    <path d="M0 42H640M0 105H640M0 168H640"/>
    <path d="M80 0V210M160 0V210M240 0V210M320 0V210M400 0V210M480 0V210M560 0V210"/>
  </g>

  <text x="20" y="26" fill="#a8a8a8" font-size="18" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EXTERNAL MCP</text>

  <g>
    <rect class="node" x="20" y="44" width="150" height="65" rx="6" stroke="#59a7ff"/>
    <text class="title" x="95" y="84" font-size="20"
          data-mobile-critical="true">MCP Client</text>
  </g>

  <g class="server-node">
    <rect class="server-aura" x="238" y="37" width="164" height="79" rx="10"
          fill="#46e6a6" filter="url(#architecture-glow)"/>
    <rect class="node" x="245" y="44" width="150" height="65" rx="6" stroke="#46e6a6"/>
    <text class="title" x="320" y="84" font-size="20"
          data-mobile-critical="true">Python MCP</text>
  </g>

  <g>
    <rect class="node" x="470" y="44" width="150" height="65" rx="6" stroke="#f0a536"/>
    <text class="title" x="545" y="84" font-size="18"
          data-mobile-critical="true">Unity Plugin</text>
  </g>

  <path class="route" d="M170 76H245" stroke="#59a7ff"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <path class="flow" d="M170 76H245" stroke="#59a7ff"/>
  <text class="protocol" x="207.5" y="62" font-size="18"
        data-mobile-critical="true">stdio</text>

  <path class="route" d="M395 76H470" stroke="#46e6a6"
        marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <path class="flow" d="M395 76H470" stroke="#46e6a6"/>
  <text class="protocol" x="432.5" y="62" font-size="18"
        data-mobile-critical="true">TCP</text>

  <circle class="motion-particle" r="3" fill="#59a7ff">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M170 76H245"/>
  </circle>
  <circle class="motion-particle" r="3" fill="#46e6a6">
    <animateMotion dur="2.8s" begin="-1.1s" repeatCount="indefinite" path="M395 76H470"/>
  </circle>

  <text x="20" y="133" fill="#a8a8a8" font-size="18" font-weight="700"
        data-mobile-critical="true"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN-UNITY CHAT</text>

  <g>
    <rect class="node" x="20" y="145" width="180" height="48" rx="6" stroke="#59a7ff"/>
    <text class="title" x="110" y="176" font-size="20"
          data-mobile-critical="true">Chat + Relay</text>
  </g>

  <g>
    <rect class="node" x="250" y="145" width="150" height="48" rx="6" stroke="#59a7ff"/>
    <text class="title" x="325" y="176" font-size="20"
          data-mobile-critical="true">CLI Backend</text>
  </g>

  <path class="route" d="M200 169H250" stroke="#59a7ff"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <path class="flow" d="M200 169H250" stroke="#59a7ff"/>
  <path class="route" d="M325 145V109" stroke="#46e6a6"
        marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <path class="flow" d="M325 145V109" stroke="#46e6a6"/>
  <text class="protocol" x="372" y="128" font-size="18"
        data-mobile-critical="true">MCP stdio</text>

  <circle class="motion-particle" r="2.6" fill="#59a7ff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M200 169H250"/>
  </circle>
  <circle class="motion-particle" r="2.8" fill="#46e6a6">
    <animateMotion dur="3.3s" begin="-1.4s" repeatCount="indefinite" path="M325 145V109"/>
  </circle>

  <g>
    <circle class="spore" cx="219" cy="128" r="2" fill="#46e6a6"/>
    <circle class="spore" cx="420" cy="143" r="1.8" fill="#59a7ff"/>
    <circle class="spore" cx="448" cy="181" r="2.2" fill="#46e6a6"/>
    <circle class="spore" cx="580" cy="142" r="1.7" fill="#f0a536"/>
    <circle class="spore" cx="602" cy="186" r="1.4" fill="#46e6a6"/>
  </g>
</svg>
