    <text x="84" y="135" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CLIENT</text>
  </g>

  <g class="node node-b">
    <rect class="node-shell" x="174" y="68" width="128" height="92" rx="6" stroke="#46e6a6"/>
    <rect class="node-scan node-scan-b" x="184" y="76" width="8" height="76" rx="4" fill="#46e6a6"/>
    <text x="238" y="110" text-anchor="middle" fill="#46e6a6" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PYTHON</text>
    <text x="238" y="135" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MCP</text>
  </g>

  <g class="node node-c">
    <rect class="node-shell" x="328" y="68" width="128" height="92" rx="6" stroke="#46e6a6"/>
    <rect class="node-scan node-scan-c" x="338" y="76" width="8" height="76" rx="4" fill="#46e6a6"/>
    <text x="392" y="110" text-anchor="middle" fill="#46e6a6" font-size="19"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LOCAL TCP</text>
    <text x="392" y="135" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BRIDGE</text>
  </g>

  <g class="node node-d">
    <rect class="node-shell" x="482" y="68" width="138" height="92" rx="6" stroke="#f0a536"/>
    <rect class="node-scan" x="492" y="76" width="8" height="76" rx="4" fill="#f0a536"/>
    <circle cx="602" cy="84" r="4" fill="#f0a536"/>
    <text x="551" y="110" text-anchor="middle" fill="#f0a536" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UNITY</text>
    <text x="551" y="135" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PLUGIN</text>
  </g>

  <g class="motion-particle architecture-lane-firefly" aria-hidden="true">
    <circle r="6.5" fill="#59a7ff" opacity=".14"/>
    <circle r="3.2" fill="#59a7ff" filter="url(#architecture-glow)"/>
    <animateMotion dur="5.8s" begin="-.4s" repeatCount="indefinite"
                   path="M148 111Q161 103 174 111L174 122Q161 130 148 122Z"/>
  </g>
  <g class="motion-particle architecture-lane-firefly" aria-hidden="true">
    <circle r="5.8" fill="#46e6a6" opacity=".13"/>
    <circle r="2.8" fill="#46e6a6" filter="url(#architecture-glow)"/>
    <animateMotion dur="5.8s" begin="-2.1s" repeatCount="indefinite"
                   path="M302 111Q315 103 328 111L328 122Q315 130 302 122Z"/>
  </g>
  <g class="motion-particle architecture-lane-firefly" aria-hidden="true">
