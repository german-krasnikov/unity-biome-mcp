    <text x="84" y="326" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UI</text>
  </g>

  <g class="node node-d node-phase-6">
    <rect class="node-shell" x="174" y="258" width="128" height="92" rx="6" stroke="#46e6a6"/>
    <rect class="node-scan" x="184" y="266" width="8" height="76" rx="4" fill="#46e6a6"/>
    <text x="238" y="301" text-anchor="middle" fill="#46e6a6" font-size="19"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LOCAL CHAT</text>
    <text x="238" y="326" text-anchor="middle" fill="#f0f0f0" font-size="20"
          font-weight="700" data-mobile-critical="true"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RELAY</text>
