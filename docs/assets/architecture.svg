<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458"
     role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Unity Biome MCP architecture</title>
  <desc id="architecture-desc">An external MCP client launches the Python MCP server over standard input and output, then exchanges framed commands with the Unity Editor plugin over localhost TCP. In-Unity Chat sends turns through the local chat relay and selected CLI backend, which uses the same Python MCP server and Unity connection.</desc>

  <defs>
    <marker id="architecture-arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#46e6a6"/>
    </marker>
    <marker id="architecture-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#59a7ff"/>
    </marker>
    <filter id="architecture-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #2b2b2b; }
    .frame { fill: none; stroke: #4a4a4a; }
    .section {
      fill: #a8a8a8;
      font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
    }
    .node { fill: #202020; stroke-width: 1.5; }
    .node-title {
      fill: #f0f0f0;
      font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
      text-anchor: middle;
    }
    .node-subtitle {
      fill: #aaa;
      font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
      text-anchor: middle;
    }
    .protocol {
      fill: #9e9eaa;
      font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
      text-anchor: middle;
    }
    .route {
      fill: none;
      stroke-width: 2;
      opacity: .35;
    }
    .flow {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 13;
      animation: architecture-flow 3.8s linear infinite;
    }
    .core-aura {
      fill: #46e6a6;
      opacity: .18;
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-breathe 3.1s ease-in-out infinite;
    }
    .core-node {
      animation: architecture-node 3.1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .particle { fill: #46e6a6; }
    .particle-blue { fill: #59a7ff; }
    .spore {
      fill: #46e6a6;
      opacity: .62;
      transform-box: fill-box;
      transform-origin: center;
      animation: architecture-drift 4.6s ease-in-out infinite alternate;
    }
    .spore-b { animation-delay: -1.7s; animation-duration: 5.4s; }
    .spore-c { animation-delay: -3.1s; animation-duration: 3.9s; }
    @keyframes architecture-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -42; }
    }
    @keyframes architecture-breathe {
      0%, 100% { opacity: .1; transform: scale(.88); }
      50% { opacity: .3; transform: scale(1.14); }
    }
    @keyframes architecture-node {
      0%, 100% { opacity: .92; }
      50% { opacity: 1; }
    }
    @keyframes architecture-drift {
      0% { opacity: .28; transform: translate(-2px, 3px) scale(.75); }
      50% { opacity: .82; transform: translate(5px, -4px) scale(1.15); }
      100% { opacity: .4; transform: translate(8px, 2px) scale(.82); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .core-aura, .core-node, .spore { animation: none !important; }
      .flow { stroke-dasharray: none; opacity: .72; }
      .core-aura { opacity: .18; }
      .motion-particle { display: none; }
    }
  </style>

  <rect class="bg" width="640" height="458"/>
  <rect class="frame" x="1" y="1" width="638" height="456" rx="7"/>

  <text class="section" x="25" y="34">EXTERNAL MCP PATH</text>

  <g>
    <rect class="node" x="25" y="58" width="170" height="86" rx="6" stroke="#59a7ff"/>
    <text class="node-title" x="110" y="93">MCP Client</text>
    <text class="node-subtitle" x="110" y="117">Claude, Codex, IDE...</text>
  </g>

  <g class="core-node">
    <rect class="core-aura" x="232" y="50" width="186" height="102" rx="12"
          filter="url(#architecture-glow)"/>
    <rect class="node" x="240" y="58" width="170" height="86" rx="6" stroke="#46e6a6"/>
    <text class="node-title" x="325" y="91" fill="#46e6a6">Python MCP Server</text>
    <text class="node-subtitle" x="325" y="116">tools and middleware</text>
  </g>

  <g>
    <rect class="node" x="455" y="58" width="160" height="86" rx="6" stroke="#f0a536"/>
    <text class="node-title" x="535" y="91">Unity Plugin</text>
    <text class="node-subtitle" x="535" y="116">commands and undo</text>
  </g>

  <path class="route" d="M195 101H240" stroke="#59a7ff"
        marker-start="url(#architecture-arrow-blue)" marker-end="url(#architecture-arrow-blue)"/>
  <path class="flow" d="M195 101H240" stroke="#59a7ff"/>
  <text class="protocol" x="218" y="87">stdio</text>

  <path class="route" d="M410 101H455" stroke="#46e6a6"
        marker-start="url(#architecture-arrow-green)" marker-end="url(#architecture-arrow-green)"/>
  <path class="flow" d="M410 101H455" stroke="#46e6a6"/>
  <text class="protocol" x="433" y="87">TCP</text>

  <circle class="particle-blue motion-particle" r="3">
    <animateMotion dur="2.7s" repeatCount="indefinite" path="M195 101H240"/>
  </circle>
  <circle class="particle motion-particle" r="3">
    <animateMotion dur="2.9s" begin="-1.1s" repeatCount="indefinite" path="M410 101H455"/>
  </circle>

  <path d="M25 184H615" stroke="#444" stroke-width="1"/>
  <circle cx="325" cy="184" r="4" fill="#46e6a6"/>
  <text class="section" x="25" y="222">IN-UNITY CHAT PATH</text>

  <g>
    <rect class="node" x="25" y="253" width="135" height="82" rx="6" stroke="#59a7ff"/>
    <text class="node-title" x="92.5" y="286">Chat UI</text>
    <text class="node-subtitle" x="92.5" y="310">Ask and Agent</text>
  </g>

  <g>
    <rect class="node" x="188" y="253" width="135" height="82" rx="6" stroke="#46e6a6"/>
    <text class="node-title" x="255.5" y="286">Chat Relay</text>
    <text class="node-subtitle" x="255.5" y="310">local sidecar</text>
  </g>

  <g>
    <rect class="node" x="351" y="253" width="135" height="82" rx="6" stroke="#59a7ff"/>
    <text class="node-title" x="418.5" y="286">CLI Backend</text>
    <text class="node-subtitle" x="418.5" y="310">selected agent</text>
  </g>

  <path class="route" d="M160 294H188" stroke="#59a7ff"
        marker-start="url(#architecture-arrow-blue)" marker-end="url(#architecture-arrow-blue)"/>
  <path class="flow" d="M160 294H188" stroke="#59a7ff"/>
  <path class="route" d="M323 294H351" stroke="#46e6a6"
        marker-start="url(#architecture-arrow-green)" marker-end="url(#architecture-arrow-green)"/>
  <path class="flow" d="M323 294H351" stroke="#46e6a6"/>

  <path class="route" d="M418 253V212Q418 197 403 197H340Q325 197 325 182V145"
        stroke="#46e6a6" marker-start="url(#architecture-arrow-green)"
        marker-end="url(#architecture-arrow-green)"/>
  <path class="flow" d="M418 253V212Q418 197 403 197H340Q325 197 325 182V145"
        stroke="#46e6a6"/>
  <text class="protocol" x="382" y="188">MCP stdio</text>

  <circle class="particle-blue motion-particle" r="2.6">
    <animateMotion dur="3.1s" repeatCount="indefinite" path="M160 294H188"/>
  </circle>
  <circle class="particle motion-particle" r="2.8">
    <animateMotion dur="3.4s" begin="-1.5s" repeatCount="indefinite" path="M323 294H351"/>
  </circle>
  <circle class="particle motion-particle" r="3">
    <animateMotion dur="4.6s" begin="-2.2s" repeatCount="indefinite"
                   path="M418 253V212Q418 197 403 197H340Q325 197 325 182V145"/>
  </circle>

  <circle class="spore" cx="514" cy="238" r="2.5"/>
  <circle class="spore spore-b" cx="547" cy="182" r="2"/>
  <circle class="spore spore-c" cx="302" cy="169" r="2.2"/>

  <g transform="translate(25 378)">
    <rect width="590" height="52" rx="6" fill="#242424" stroke="#414141"/>
    <circle cx="22" cy="26" r="5" fill="#46e6a6"/>
    <text x="40" y="22" fill="#d7d7d7" font-size="12" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ONE TOOL SURFACE</text>
    <text x="40" y="39" fill="#9e9eaa" font-size="11"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">External clients and Chat reach the same Unity command catalog</text>
  </g>
</svg>
