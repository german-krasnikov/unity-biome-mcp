[project]
name = "unity-biome-mcp"
version = "1.50.4"
description = "MCP server for Unity Editor control"
license = {text = "MIT"}
authors = [{name = "German Krasnikov", email = "german.krasnikov@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.28.0,<2",
    "pydantic>=2.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/german-krasnikov/unity-biome-mcp"
Repository = "https://github.com/german-krasnikov/unity-biome-mcp"
Issues = "https://github.com/german-krasnikov/unity-biome-mcp/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.1",
    "packaging>=24.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0",
]

[project.scripts]
unity-biome-mcp = "unity_mcp.cli:main"
unity-biome-mcp-relay = "unity_mcp.chat_relay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "../scripts"]
asyncio_mode = "auto"
python_files = "test_*.py"
addopts = ["--strict-markers", "--timeout=30"]
filterwarnings = [
    "error::EncodingWarning",
]
markers = [
    "live: requires running Unity Editor with MCP plugin on :9500",
    "live_cli: paid external CLI/API call; opt-in with UNITY_MCP_RUN_LIVE_CLI=1",
    "monkey: stress/chaos tests for chat_relay (connection storms, process leaks, protocol torture)",
    "live_chat: requires running Unity + MCPChatWindow; subset of live",
    "timeout: per-test timeout override (pytest-timeout)",
    "conformance: MCP conformance gate tests — portable across any Unity+MCP endpoint",
    "requires_graphics: requires a Unity worker with graphics/screenshot support",
    "cross_project: requires two running Unity editors on different ports",
    "slow: tests that take >5s (reload stability, property-based)",
    "stateful: Hypothesis RuleBasedStateMachine tests — no Unity, finds sequence bugs",
    "asyncio: mark test as asyncio (auto-registered by pytest-asyncio; explicit here for --strict-markers)",
    "wire: wire-protocol contract tests — no Unity, no live marker, runs in ci-python.yml",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "TCH", "PERF"]
ignore = ["E501", "E402", "E701", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["unity_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unity_mcp"]

[tool.coverage.run]
source = ["unity_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
    "@overload",
]
