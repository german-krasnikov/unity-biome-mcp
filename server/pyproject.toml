[project]
name = "unity-biome-mcp"
version = "1.54.0"
description = "MCP server for Unity Editor control"
license = {text = "MIT"}
authors = [{name = "German Krasnikov", email = "german.krasnikov@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.28.0,<2",
    "pydantic>=2.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/german-krasnikov/unity-biome-mcp"
Repository = "https://github.com/german-krasnikov/unity-biome-mcp"
Issues = "https://github.com/german-krasnikov/unity-biome-mcp/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.1",
    # import-linter==2.15 pins grimp>=3.17, and grimp 3.16/3.17 ship no cp314
    # macOS wheel (only cp314t free-threaded) -- forces a Rust/maturin source
    # build unbuildable without a Rust toolchain (also breaks `pip install
    # ".[dev]"` on the macos-latest CI job). 2.14's cli.py/forbidden-contract
    # code is byte-identical to 2.15's (diff confirmed 2026-09-05; only
    # unrelated `graph` subcommand lazy-import-arrow changed) and only
    # requires grimp>=3.14, so pin <2.15 + cap grimp<3.16 to stay wheel-only.
    "import-linter>=2.14,<2.16",
    "grimp<3.16",
    "packaging>=24.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
]

[project.scripts]
unity-biome-mcp = "unity_mcp.cli:main"
unity-biome-mcp-relay = "unity_mcp.chat_relay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "../scripts", ".."]
asyncio_mode = "auto"
python_files = "test_*.py"
addopts = ["--strict-markers", "--timeout=30"]
filterwarnings = [
    "error::EncodingWarning",
]
markers = [
    "live: requires running Unity Editor with MCP plugin on :9500",
    "live_cli: paid external CLI/API call; opt-in with UNITY_MCP_RUN_LIVE_CLI=1",
    "monkey: stress/chaos tests for chat_relay (connection storms, process leaks, protocol torture)",
    "live_chat: requires running Unity + MCPChatWindow; subset of live",
    "timeout: per-test timeout override (pytest-timeout)",
    "conformance: MCP conformance gate tests — portable across any Unity+MCP endpoint",
    "requires_graphics: requires a Unity worker with graphics/screenshot support",
    "cross_project: requires two running Unity editors on different ports",
    "slow: tests that take >5s (reload stability, property-based)",
    "stateful: Hypothesis RuleBasedStateMachine tests — no Unity, finds sequence bugs",
    "asyncio: mark test as asyncio (auto-registered by pytest-asyncio; explicit here for --strict-markers)",
    "wire: wire-protocol contract tests — no Unity, no live marker, runs in ci-python.yml",
    "real_clock: opts out of tests/_fast_clock.py's autouse fixture — use for a test that legitimately asserts a real backoff/timer constant value",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "TCH", "PERF"]
ignore = ["E501", "E402", "E701", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["unity_mcp"]

[tool.importlinter]
root_package = "unity_mcp"

[[tool.importlinter.contracts]]
name = "tools must not import the composition root (server)"
type = "forbidden"
source_modules = ["unity_mcp.tools"]
forbidden_modules = ["unity_mcp.server"]

[[tool.importlinter.contracts]]
name = "transport/session layer stays independent of server and tools"
type = "forbidden"
source_modules = [
    "unity_mcp.bridge",
    "unity_mcp.bridge_socket",
    "unity_mcp.bridge_heartbeat",
    "unity_mcp.bridge_retry",
    "unity_mcp.bridge_result",
    "unity_mcp.bridge_cassette",
    "unity_mcp.bridge_reload_state",
    "unity_mcp.connection_slot",
]
forbidden_modules = ["unity_mcp.server", "unity_mcp.tools"]

[[tool.importlinter.contracts]]
name = "tools must not import the middleware policy layer"
type = "forbidden"
source_modules = ["unity_mcp.tools"]
forbidden_modules = [
    "unity_mcp.middleware",
    "unity_mcp.middleware_alias",
    "unity_mcp.middleware_async",
    "unity_mcp.middleware_guards",
    "unity_mcp.middleware_hooks",
    "unity_mcp.middleware_paths",
    "unity_mcp.middleware_pipeline",
    "unity_mcp.middleware_reads",
    "unity_mcp.middleware_types",
]
# Reviewed point exception (PR-02, found by this contract, not introduced by
# it): tools/permission_prompt_tool.py::_get_broker() lazily imports
# unity_mcp.permission_broker, which imports unity_mcp.middleware_types --
# the same reverse-import shape as the tools/connection.py bug this PR fixes,
# one hop further removed. permission_prompt_tool.py's own comment already
# documents the circular-import tension. Fixing it means changing the
# permission-gating security path and is out of this PR's 0.5-1 day budget;
# tracked as a follow-up to convert it to the same DI-callback pattern.
ignore_imports = [
    "unity_mcp.tools.permission_prompt_tool -> unity_mcp.permission_broker",
]

[[tool.importlinter.contracts]]
name = "public plugin API stays independent of the composition root"
type = "forbidden"
source_modules = ["unity_mcp.plugin_api"]
forbidden_modules = ["unity_mcp.server"]

[[tool.importlinter.contracts]]
name = "diagnose/reload_ladder stay algorithm+evidence only (no import of the sync facade)"
type = "forbidden"
source_modules = ["unity_mcp.tools.diagnose", "unity_mcp.tools.reload_ladder"]
forbidden_modules = ["unity_mcp.tools.sync"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.14,<2.16",  # see [project.optional-dependencies].dev comment
    "grimp<3.16",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unity_mcp"]

[tool.coverage.run]
source = ["unity_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
    "@overload",
]
